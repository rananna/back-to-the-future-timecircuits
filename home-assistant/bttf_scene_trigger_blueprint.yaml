blueprint:
  name: "BTTF - Cinematic Scene Trigger"
  description: >-
    A simple way to trigger the full, cinematic time travel animation for a specific destination year.

    This blueprint creates a script that can be called as a service from automations or other scripts. It's perfect for integrating into Home Assistant scenes or using as a response to an event, like a person arriving home or a movie starting.
  domain: script
  input:
    target_device:
      name: Time Circuits Device
      description: Select the BTTF Time Circuits clock device.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    destination_year:
      name: Destination Year
      description: The four-digit year to travel to.
      default: "2015"
      selector:
        text:

variables:
  device_id: !input target_device
  unique_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"
  year_input: !input destination_year

sequence:
  - service: text.set_value
    target:
      entity_id: "text.{{ unique_id }}_dest_year"
    data:
      value: "{{ year_input }}"
  - delay:
      milliseconds: 250
  - service: button.press
    target:
      entity_id: "button.{{ unique_id }}_trigger_animation"