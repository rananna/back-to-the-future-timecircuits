blueprint:
  name: "BTTF - Radio Streamer"
  description: >-
    Starts or stops an internet radio stream on the Time Circuits clock.
    To start a stream, provide a valid audio stream URL. To stop, provide the command "stop".

    This blueprint creates a script that can be called as a service from automations or other scripts.

    When a stream is started, the override display will show "\nRADIO...". When stopped, the blueprint will only turn off the override switch if the message is still "\nRADIO...". This prevents this blueprint from interfering with a more important notification that may have started after the radio was activated.
  domain: script
  input:
    target_device:
      name: Time Circuits
      description: Select the BTTF Time Circuits clock device.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    radio_command:
      name: Radio Command
      description: The URL of the live radio stream, or "stop" to end streaming.
      selector:
        text:

variables:
  device_id: !input target_device
  unique_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"
  command: !input radio_command

sequence:
  - choose:
      # Condition 1: The command is "stop"
      - conditions:
          - "{{ command == 'stop' }}"
        sequence:
          # Stop the radio stream via MQTT.
          - service: mqtt.publish
            data:
              topic: "bttf_tc/{{ unique_id }}/radio/command"
              payload: "stop"
          # If the override message is still "RADIO...", turn off the override switch.
          # This prevents us from incorrectly turning off a different notification
          # that may have started after the radio was activated.
          - if:
              - condition: template
                value_template: "{{ states('text.' ~ unique_id ~ '_override_message') == '\nRADIO...' }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: "switch.{{ unique_id }}_override_switch"
    # Default action: The command is a URL
    default:
      # Set the override message to "RADIO..." on the middle display.
      - service: text.set_value
        target:
          entity_id: "text.{{ unique_id }}_override_message"
        data:
          value: "\nRADIO..."
      # Turn on the override switch to display the message.
      - service: switch.turn_on
        target:
          entity_id: "switch.{{ unique_id }}_override_switch"
      # Send the radio stream URL to the clock via a direct MQTT call.
      # This is necessary because there is no dedicated Home Assistant entity for this.
      - service: mqtt.publish
        data:
          topic: "bttf_tc/{{ unique_id }}/radio/command"
          payload: "{{ command }}"