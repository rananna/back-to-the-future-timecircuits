# home-assistant/bttf_sequencer_blueprint.yaml
blueprint:
  name: "BTTF - Sequencer"
  description: |
    Triggers a custom sequence of actions on the Time Circuits display.
    This is a "callable" automation that has no trigger; you call it from another automation or script.

    NOTE: This is an advanced blueprint that requires crafting a JSON payload and uses direct MQTT communication with the device.

    The sequence is defined by a JSON payload, which is an array of command objects. Each object must have a "command" key.

    Supported Commands:
    - `flash`: Flashes a segment of the display.
      - `segment`: (Required) The display segment to flash. Can be "dest_month", "dest_day", "dest_year", "dest_time", "pres_month", "pres_day", "pres_year", "pres_time", "last_month", "last_day", "last_year", "last_time".
      - `duration`: (Optional) The duration of the flash in milliseconds. Defaults to 500.
    - `sound`: Plays a sound effect.
      - `effect`: (Required) The name of the sound effect to play. See device documentation for available sounds.
    - `message`: Displays a message on one of the main displays.
      - `display`: (Required) The display to show the message on. Can be "destination", "present", or "last_departed".
      - `month`, `day`, `year`, `time`: (Required) The text to display in each segment.
    - `delay`: Pauses the sequence for a specified duration.
      - `duration`: (Required) The delay in milliseconds.

    Example Payload:
    ```json
    [
      {
        "command": "flash",
        "segment": "dest_year"
      },
      {
        "command": "sound",
        "effect": "ALARM_SOUND"
      },
      {
        "command": "message",
        "display": "destination",
        "month": "INTRUDER",
        "day": "ALERT",
        "year": "!!",
        "time": "12:00"
      },
      {
        "command": "delay",
        "duration": 5000
      },
      {
        "command": "message",
        "display": "destination",
        "month": "",
        "day": "",
        "year": "",
        "time": ""
      }
    ]
    ```
  domain: automation
  input:
    target_device:
      name: Time Circuits
      description: "Select the BTTF Time Circuits clock device."
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    sequence_payload:
      name: Sequence Payload
      description: "The JSON payload that defines the sequence of actions. See documentation for format."
      selector:
        text:
          multiline: true

variables:
  device_id: !input target_device
  unique_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"
  payload: !input sequence_payload

mode: single
trigger: []
action:
  - service: mqtt.publish
    data:
      topic: "BTTF_TC/{{ unique_id }}/sequencer/command"
      payload: "{{ payload }}"