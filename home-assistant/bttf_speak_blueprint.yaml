blueprint:
  name: "BTTF - Speak Text"
  description: >-
    Makes the Time Circuits clock speak any text sent to the 'TTS Text' entity.

    This automation is triggered whenever the state of the `TTS Text`
    entity changes. It then uses a specified Home Assistant TTS service to generate
    speech and plays it on the clock's speaker.

    After the text is spoken, the entity's state is cleared to allow sending the same message again.
  domain: automation
  input:
    tts_entity:
      name: TTS Text Entity
      description: "Select the 'TTS Text' entity for your Time Circuits clock (e.g., text.bttf_tc_123456_tts_text)."
      selector:
        entity:
          domain: text
    tts_service:
      name: TTS Service
      description: The TTS service to use for generating the speech URL (e.g., tts.google_en_com).
      default: "tts.google_en_com"
      selector:
        text:
    volume:
      name: Playback Volume
      description: The volume for the TTS message (0-100).
      default: 80
      selector:
        number:
          min: 0
          max: 100
          mode: slider

mode: single
max_exceeded: silent

variables:
  tts_entity: !input tts_entity
  tts_service: !input tts_service
  volume: !input volume
  # Derive the device and unique ID from the selected entity to ensure we publish to the correct MQTT topic.
  device_id: "{{ device_id(tts_entity) }}"
  unique_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"

trigger:
  - platform: state
    entity_id: !input tts_entity

condition:
  # Ensure the trigger is not from an empty or cleared state.
  - condition: template
    value_template: "{{ trigger.to_state.state | string != '' }}"
  # Do not trigger if the text hasn't actually changed.
  - condition: template
    value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"

action:
  # 1. Generate the TTS audio URL from the text provided in the entity's state.
  - service: "{{ tts_service }}"
    data:
      message: "{{ trigger.to_state.state }}"
    response_variable: tts_response

  # 2. Publish the audio URL to the clock's MQTT topic for playback.
  - service: mqtt.publish
    data:
      topic: "bttf_tc/{{ unique_id }}/tts/command"
      payload: '{ "url": "{{ tts_response.url }}", "volume": {{ volume }} }'

  # 3. Wait for the audio to finish playing by monitoring the audio sensor.
  # This prevents the text from being cleared before the message has been fully spoken.
  - wait_for_trigger:
      - platform: state
        entity_id: "sensor.{{ unique_id }}_audio_stream_status"
        to: "IDLE"
    timeout: "00:01:00" # Max 1 minute wait
    continue_on_timeout: true

  # 4. Clear the text entity's state. This allows the same message to be sent again.
  - service: text.set_value
    target:
      entity_id: !input tts_entity
    data:
      value: ""