# home-assistant/bttf_advanced_notifier_blueprint.yaml
blueprint:
  name: "BTTF - Advanced Notifier"
  description: >-
    Displays a temporary message on the Time Circuits with an optional sound.

    This blueprint creates a script that can be called as a service from automations or other scripts.

    It includes a safety feature: if an override message is already being displayed when this blueprint is called, the new notification will be shown for its specified duration, but it will not turn off the override switch when it's done. This prevents a short, low-priority notification from canceling a longer, more important one.
  domain: script
  input:
    target_device:
      name: Time Circuits
      description: Select the BTTF Time Circuits clock device.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    message:
      name: Message
      description: "The text to display. Use '\\n' for new lines (e.g., LINE 1\\nLINE 2\\nLINE 3)."
      selector:
        text:
          multiline: true
    duration:
      name: Display Duration (seconds)
      description: How long the message should be displayed before the clock returns to normal.
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: seconds
    sound_effect:
      name: Sound Effect
      description: "Select an optional sound effect to play."
      default: "None"
      selector:
        select:
          options:
            - "None"
            - "ALARM_SOUND"
            - "ARRIVAL_THUD"
            - "CONFIRM_ON"
            - "EASTER_EGG"
            - "REBOOT_SOUND"
            - "REMINDER_ALERT"
            - "TIME_TRAVEL_FAIL"

variables:
  device_id: !input target_device
  unique_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"
  message_text: !input message
  sound: !input sound_effect
  delay_seconds: !input duration

sequence:
  # This 'try/finally' block ensures the override display is always turned off,
  # but only if it wasn't already on before this automation started.
  # This prevents a short notification from cancelling a longer, more important one.
  - variables:
      # Store the state of the override switch to restore it later.
      override_was_on: "{{ is_state('switch.' ~ unique_id ~ '_override_switch', 'on') }}"
  - sequence:
      # 1. Set the override message text
      - service: text.set_value
        target:
          entity_id: "text.{{ unique_id }}_override_message"
        data:
          value: "{{ message_text }}"
      # 2. Turn on the override switch to display the message
      - service: switch.turn_on
        target:
          entity_id: "switch.{{ unique_id }}_override_switch"
      # 3. Play a sound if one was selected
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ sound != 'None' }}"
            sequence:
              - service: select.select_option
                target:
                  entity_id: "select.{{ unique_id }}_play_sound"
                data:
                  option: "{{ sound }}"
      # 4. Wait for the specified duration
      - delay:
          seconds: "{{ delay_seconds }}"
  - finally:
      # Turn off the override switch only if it was off before this automation ran.
      - if:
          - "{{ not override_was_on }}"
        then:
          - service: switch.turn_off
            target:
              entity_id: "switch.{{ unique_id }}_override_switch"