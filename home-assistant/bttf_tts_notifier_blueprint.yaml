blueprint:
  name: "BTTF - TTS Notifier"
  description: >-
    Converts a text message into speech and plays it on the clock's speaker using a specified Home Assistant TTS service.
    An optional message can be displayed on the main displays during playback.

    This is a "callable" automation that has no trigger and is designed to be called from another automation or script.

    If you provide optional `display_text`, this blueprint has a safety feature: it checks if an override message is already active. If so, it will display the new text, but will not turn off the override switch when the TTS message is finished. This prevents a short TTS notification from canceling a longer, more important message.
  domain: automation
  input:
    target_device:
      name: Time Circuits Display
      description: Select the BTTF Time Circuits clock device.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    tts_service:
      name: TTS Service
      description: The TTS service to use for generating the speech URL (e.g., tts.google_en_com).
      default: "tts.google_en_com"
      selector:
        text:
    message_text:
      name: Message Text
      description: The text you want the clock to say.
      selector:
        text:
          multiline: true
    volume:
      name: Playback Volume
      description: The volume for the TTS message (0-100).
      default: 80
      selector:
        number:
          min: 0
          max: 100
    display_text:
      name: Display Text (Optional)
      description: "A message to show on the clock's display. Use '\\n' for new lines."
      default: ""
      selector:
        text:
          multiline: true

variables:
  device_id: !input target_device
  unique_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"
  display_text: !input display_text
  tts_service: !input tts_service
  message_text: !input message_text
  volume: !input volume

mode: single
trigger: []

action:
  # This 'try/finally' block ensures the override display is always turned off.
  - variables:
      # Store the state of the override switch to restore it later.
      # This prevents the blueprint from turning off an override that was active before it ran.
      override_was_on: "{{ is_state('switch.' ~ unique_id ~ '_override_switch', 'on') }}"

  - sequence:
      # If display_text is provided, set the message and turn on the override switch.
      - if:
          - "{{ display_text != '' }}"
        then:
          - service: text.set_value
            target:
              entity_id: "text.{{ unique_id }}_override_message"
            data:
              value: "{{ display_text }}"
          - service: switch.turn_on
            target:
              entity_id: "switch.{{ unique_id }}_override_switch"

      # Generate the TTS URL from the selected service.
      - service: "{{ tts_service }}"
        data:
          message: "{{ message_text }}"
        response_variable: tts_response

      # Play the TTS audio on the clock via a direct MQTT call.
      # This is necessary because there is no dedicated Home Assistant entity for TTS playback.
      - service: mqtt.publish
        data:
          topic: "BTTF_TC/{{ unique_id }}/tts/command"
          payload: '{ "url": "{{ tts_response.url }}", "volume": {{ volume }} }'

      # Wait for the audio to finish playing by monitoring the audio sensor.
      - wait_for_trigger:
          - platform: state
            entity_id: "sensor.{{ unique_id }}_audio_stream_status"
            to: "IDLE"
        timeout: "00:01:00" # Max 1 minute wait
        continue_on_timeout: true

  - finally:
      # Turn off the override switch only if it was off before this automation ran.
      - if:
          - "{{ not override_was_on }}"
        then:
          - service: switch.turn_off
            target:
              entity_id: "switch.{{ unique_id }}_override_switch"