blueprint:
  name: BTTF Time Circuits - Visual Effects Generator
  description: >-
    Creates a script to run various visual text effects like Typewriter, Crossfade, Scanner, or Bar Graph.
    Refer to the parameter descriptions to see which ones are used by your selected effect.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to show the effect on.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    effect:
      name: Visual Effect
      description: "Select the visual effect to run."
      default: "TYPEWRITER"
      selector:
        select:
          options:
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Crossfade Text"
              value: "CROSSFADE_TEXT"
            - label: "Scanner"
              value: "SCANNER"
            - label: "Bar Graph"
              value: "BAR_GRAPH"
    text_to_display:
      name: Text to Display
      description: "For Typewriter/Crossfade: the text to show. For Bar Graph: text to overlay. Supports templates."
      default: ""
    param1:
      name: "Parameter 1 (Speed / Percentage)"
      description: "For Typewriter: speed (ms). For Bar Graph: starting percentage (0-100). Not used by others."
      default: 75
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: "ms / %"
    param2:
      name: "Parameter 2 (Duration)"
      description: "For Bar Graph: animation duration (ms). Not used by others."
      default: 1000
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: "ms"
    restore_row:
      name: Restore Row After Effect
      description: "If enabled, the row will be restored to its previous state after the effect finishes."
      default: true
      selector:
        boolean: {}

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set step = {'command': effect, 'targetRow': target_row, 'targetSegment': -1} -%}
        {%- if text_to_display != "" -%}
          {%- do step.update({'stringParam': text_to_display}) -%}
        {%- endif -%}
        {%- if effect == 'TYPEWRITER' -%}
          {%- do step.update({'intParam': param1}) -%}
        {%- elif effect == 'BAR_GRAPH' -%}
          {%- do step.update({'intParam': param1, 'intParam2': param2}) -%}
        {%- endif -%}
        {%- set steps = [step] -%}
        {%- if restore_row -%}
          {%- set steps = steps + [{"command": "RESTORE_ROW", "targetRow": target_row}] -%}
        {%- endif -%}
        {{ {"tracks": [steps]} | to_json }}