blueprint:
  name: BTTF Time Circuits - Visual Effects Generator
  description: >-
    Creates a script to run various visual text effects like Typewriter, Crossfade, Scanner, or Bar Graph.
    Only the parameters for the selected effect will be used.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to show the effect on.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    effect:
      name: Visual Effect
      description: "Select the visual effect to run."
      default: "TYPEWRITER"
      selector:
        select:
          options:
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Crossfade Text"
              value: "CROSSFADE_TEXT"
            - label: "Scanner"
              value: "SCANNER"
            - label: "Bar Graph"
              value: "BAR_GRAPH"
    text_to_display:
      name: Text to Display
      description: "Required for Typewriter, Crossfade, and Bar Graph (as overlay text). Supports templates."
      default: ""
    typewriter_delay:
      name: "[Typewriter] Delay"
      description: "The delay between each character appearing, in milliseconds. Lower is faster."
      default: 75
      selector:
        number:
          min: 20
          max: 500
          unit_of_measurement: "ms"
    crossfade_duration:
      name: "[Crossfade] Duration"
      description: "The duration of the fade effect, in milliseconds."
      default: 1000
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: "ms"
    bargraph_percentage:
      name: "[Bar Graph] Starting Percentage"
      description: "The percentage (0-100) at which the bar graph should start."
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    bargraph_duration:
      name: "[Bar Graph] Animation Duration"
      description: "The total time for the bar graph animation to complete, in milliseconds."
      default: 2000
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: "ms"
    restore_row:
      name: Restore Row After Effect
      description: "If enabled, the row will be restored to its previous state after a delay."
      default: true
      selector:
        boolean: {}
    duration:
      name: "[Scanner] Display Duration (seconds)"
      description: "For continuous effects like Scanner, this is how long the effect will be visible before restoring. For other effects, this is ignored."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: "s"

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set step = {'command': effect, 'targetRow': target_row, 'targetSegment': -1} -%}
        {%- if text_to_display != "" -%}
          {%- do step.update({'stringParam': text_to_display}) -%}
        {%- endif -%}
        {%- if effect == 'TYPEWRITER' -%}
          {%- do step.update({'intParam': typewriter_delay}) -%}
        {%- elif effect == 'CROSSFADE_TEXT' -%}
          {%- do step.update({'intParam': crossfade_duration}) -%}
        {%- elif effect == 'BAR_GRAPH' -%}
          {%- do step.update({'intParam': bargraph_percentage, 'intParam2': bargraph_duration}) -%}
        {%- endif -%}
        {%- set steps = [step] -%}
        {%- if restore_row -%}
          {#- For effects with a defined duration, wait for them to finish. For continuous effects, use the manual duration. -#}
          {%- set wait_step = namespace(duration=0) -%}
          {%- if effect == 'TYPEWRITER' -%}
            {#- Add 1 second to the end to ensure the full text is readable -#}
            {%- set wait_step.duration = ((text_to_display | length) * typewriter_delay) + 1000 -%}
          {%- elif effect == 'CROSSFADE_TEXT' -%}
            {%- set wait_step.duration = crossfade_duration * 2 -%}
          {%- elif effect == 'BAR_GRAPH' -%}
            {%- set wait_step.duration = bargraph_duration -%}
          {%- else -%}
            {#- For Scanner or other continuous effects, use the manual duration -#}
            {%- set wait_step.duration = duration * 1000 -%}
          {%- endif -%}
          {%- set steps = steps + [
            {"command": "WAIT", "intParam": wait_step.duration | int},
            {"command": "RESTORE_ROW", "targetRow": target_row}
          ] -%}
        {%- endif -%}
        {{ {"tracks": [steps]} | to_json }}