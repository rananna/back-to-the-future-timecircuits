blueprint:
  name: BTTF Time Circuits - Display Text from a Helper
  description: >-
    Displays the text from an 'input_text' helper entity on one of the display rows.
    This allows you to change the message from your dashboard without editing the script.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to show the text on.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    text_helper:
      name: Text Helper Entity
      description: "The 'input_text' helper that holds the message you want to display."
      selector:
        entity:
          domain: input_text
    animation_style:
      name: Animation Style
      description: "How the text should be displayed."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text (Instant)"
              value: "SET_TEXT"
            - label: "Marquee (Scroll)"
              value: "MARQUEE"
            - label: "Scramble Text"
              value: "SCRAMBLE_TEXT"
    speed:
      name: Animation Speed (ms)
      description: "For Marquee or Scramble, the speed of the effect. Lower is faster. Ignored for Set Text."
      default: 75
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set helper_text = states(text_helper) -%}
        {%- set step = {
          "command": animation_style,
          "targetRow": target_row,
          "targetSegment": -1,
          "stringParam": helper_text
        } -%}
        {%- if animation_style in ['MARQUEE', 'SCRAMBLE_TEXT'] -%}
          {%- do step.update({'intParam': speed}) -%}
        {%- endif -%}
        {%- set steps = [step] -%}
        {{ {"tracks": [steps]} | to_json }}