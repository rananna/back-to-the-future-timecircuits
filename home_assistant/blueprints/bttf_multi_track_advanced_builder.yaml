blueprint:
  name: BTTF Time Circuits - Multi-Track Advanced Builder
  description: >-
    The ultimate power-user blueprint for creating complex, parallel animations.
    Define a sequence of commands for each of the three display rows (tracks) to run simultaneously.
    This blueprint is for advanced users comfortable with the device's sequencer commands.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    track_1_commands:
      name: Top Row Commands (JSON Array)
      description: "A JSON-formatted array of commands for the top display row. See documentation for examples. Supports templates."
      selector:
        text:
          multiline: true
      default: "[]"
    track_2_commands:
      name: Middle Row Commands (JSON Array)
      description: "A JSON-formatted array of commands for the middle display row. See documentation for examples. Supports templates."
      selector:
        text:
          multiline: true
      default: "[]"
    track_3_commands:
      name: Bottom Row Commands (JSON Array)
      description: "A JSON-formatted array of commands for the bottom display row. See documentation for examples. Supports templates."
      selector:
        text:
          multiline: true
      default: "[]"

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set all_tracks = [] -%}
        {%- set track_1 = track_1_commands | from_json -%}
        {%- if track_1 and track_1 | count > 0 -%}
          {%- do all_tracks.append(track_1) -%}
        {%- endif -%}
        {%- set track_2 = track_2_commands | from_json -%}
        {%- if track_2 and track_2 | count > 0 -%}
          {%- do all_tracks.append(track_2) -%}
        {%- endif -%}
        {%- set track_3 = track_3_commands | from_json -%}
        {%- if track_3 and track_3 | count > 0 -%}
          {%- do all_tracks.append(track_3) -%}
        {%- endif -%}
        {{ {'tracks': all_tracks} | to_json }}