blueprint:
  name: BTTF Time Circuits - Countdown Sequence
  description: >-
    Creates a script that displays a numerical countdown on one of the display rows.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to show the countdown on.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    start_number:
      name: Start Number
      description: The number to start counting down from.
      default: 10
      selector:
        number:
          min: 1
          max: 9999
    end_text:
      name: End Text
      description: "Optional text to display when the countdown finishes (e.g., 'LIFTOFF')."
      default: ""
    countdown_delay:
      name: Countdown Delay (milliseconds)
      description: "The delay between each number change. 1000ms = 1 second."
      default: 1000
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: "ms"
    end_text_duration:
      name: End Text Duration (seconds)
      description: "How long the end text should be displayed before the row is restored. Only used if End Text is provided."
      default: 3
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: "s"
    restore_row:
      name: Restore Row After Countdown
      description: "If enabled, the row will be restored to its previous state after the countdown finishes."
      default: true
      selector:
        boolean: {}

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set steps = [] -%}
        {# Add the core countdown command #}
        {%- set steps = steps + [{
          "command": "COUNTDOWN",
          "targetRow": target_row,
          "targetSegment": -1,
          "intParam": start_number,
          "intParam2": countdown_delay
        }] -%}

        {# The COUNTDOWN command is blocking. A WAIT command must be inserted *after* it to allow the final number to be displayed before moving to the next step. #}
        {%- set steps = steps + [{"command": "WAIT", "intParam": countdown_delay}] -%}

        {# If there is end text, display it and wait again. #}
        {%- if end_text != "" -%}
          {%- set steps = steps + [{
            "command": "SET_TEXT",
            "targetRow": target_row,
            "targetSegment": -1,
            "stringParam": end_text
          }] -%}
          {%- set text_duration = (end_text_duration * 1000) | int -%}
          {%- if text_duration > 0 and restore_row -%}
            {%- set steps = steps + [{"command": "WAIT", "intParam": text_duration}] -%}
          {%- endif -%}
        {%- endif -%}

        {# Finally, if requested, restore the row to its previous state #}
        {%- if restore_row -%}
          {%- set steps = steps + [{"command": "RESTORE_ROW", "targetRow": target_row}] -%}
        {%- endif -%}

        {{ {"tracks": [steps]} | to_json }}