blueprint:
  name: "BTTF Time Circuits: Display Text"
  description: >-
    A blueprint for displaying a text message on the Time Circuits, with optional sound, volume, looping, and advanced effects.
  domain: script
  input:
    device:
      name: Time Circuits Device
      description: The BTTF Time Circuits device to control.
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "The display row(s) to show the message on."
      default: "TOP"
      selector:
        select:
          options:
            - label: "Top Row (Destination Time)"
              value: "TOP"
            - label: "Middle Row (Present Time)"
              value: "MIDDLE"
            - label: "Bottom Row (Last Time Departed)"
              value: "BOTTOM"
            - label: "All Rows"
              value: "ALL"

    text_to_display:
      name: "Text to Display"
      description: "The message to display. Supports templates."
      default: ""
      selector:
        text: {}

    effect:
      name: "Visual Effect"
      description: "The visual effect to use for the message."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text (Static)"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Pulse"
              value: "PULSE"
            - label: "Flash"
              value: "FLASH"
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Scramble Text"
              value: "SCRAMBLE_TEXT"
    duration:
      name: "Display Duration (s)"
      description: "Duration for the non-blocking 'Set Text' effect. Other effects like Pulse and Flash have their own internal timing."
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    marquee_speed:
      name: "Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"

    audio_source:
      name: "Audio Source"
      description: "Choose whether to play a sound with the visual effect."
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Built-in Sound Effect"
              value: "builtin"
            - label: "Stream from Home Assistant"
              value: "media"
    sound_effect:
      name: "Sound Effect"
      description: "A built-in sound effect to play from the device."
      default: "sys_beep.mp3"
      selector:
        select:
          options:
            - label: "System Beep"
              value: "sys_beep.mp3"
            - label: "Acceleration"
              value: "ACCELERATION.mp3"
            - label: "Arrival Chime"
              value: "arrival_chime.mp3"
            - label: "Electric Sparks"
              value: "electric_sparks.mp3"
            - label: "Engine Rev"
              value: "engine_rev.mp3"
            - label: "Flux Capacitor Power On"
              value: "flux_capacitor_power_on.mp3"
            - label: "Hum"
              value: "hum.mp3"
            - label: "Keypad Beeps"
              value: "keypad_beeps.mp3"
            - label: "Lock On"
              value: "lock_on.mp3"
            - label: "Relay Activation"
              value: "relay_activation.mp3"
            - label: "Time Travel"
              value: "time_travel.mp3"
    media_file:
      name: "Media File"
      description: "Audio file to stream from the Home Assistant media library."
      default: ""
      selector:
        media:
          filter:
            media_class: music
    volume:
      name: Volume
      description: "Set the volume for this specific alert (0-100). Only used if an audio source is selected."
      default: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

    repeat:
      name: "Repeat Count"
      description: "Number of times to repeat the alert. Built-in sounds will repeat; streamed audio will play once at the start."
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state after the effect (and any loops) completes."
      default: true
      selector:
        boolean: {}

mode: single

variables:
  device_name: "{{ device_attr(device, 'name') | slugify }}"
  final_target_row: !input target_row
  final_text: "{{ !input text_to_display | default('') }}"
  final_effect: !input effect
  final_duration: !input duration
  final_speed: !input marquee_speed
  final_audio_source: !input audio_source
  final_sound: !input sound_effect
  final_media_file: "{{ !input media_file | default('') }}"
  final_volume: !input volume
  final_repeat: !input repeat
  final_restore_row: !input restore_row
  
  payload: >
    {%- macro generate_sequence_payload(target, effect, text, duration, speed, restore, sound, sound_vol, repeat_count, audio_src) -%}
      {%- set blocking_effects = ['PULSE', 'FLASH', 'MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT'] -%}
      {%- set visual_command = {'command': effect, 'targetSegment': -1, 'stringParam': text} -%}
      {%- if effect == 'MARQUEE' -%}
        {%- do visual_command.update({'intParam': speed | int}) -%}
      {%- elif effect in ['PULSE', 'FLASH'] -%}
        {%- set final_duration_ms = (duration * 1000) | int -%}
        {%- do visual_command.update({'intParam': final_duration_ms}) -%}
      {%- endif -%}
      {%- set core_commands = [visual_command] -%}
      {%- if effect not in blocking_effects -%}
        {%- set wait_duration = (duration * 1000) | int -%}
        {%- do core_commands.append({'command': 'WAIT', 'intParam': wait_duration}) -%}
      {%- endif -%}
      {%- set final_commands = [] -%}
      {%- if (repeat_count | int) > 1 -%}
        {%- do final_commands.append({'command': 'LOOP_START', 'intParam': repeat_count | int}) -%}
        {%- do final_commands.extend(core_commands) -%}
        {%- do final_commands.append({'command': 'LOOP_END'}) -%}
      {%- else -%}
        {%- do final_commands.extend(core_commands) -%}
      {%- endif -%}
      {%- if restore -%}
        {%- do final_commands.append({'command': 'RESTORE_ROW'}) -%}
      {%- endif -%}
      {%- set tracks = [] -%}
      {%- if target == 'ALL' -%}
        {%- do tracks.append({'targetRow': 'TOP', 'commands': final_commands}) -%}
        {%- do tracks.append({'targetRow': 'MIDDLE', 'commands': final_commands}) -%}
        {%- do tracks.append({'targetRow': 'BOTTOM', 'commands': final_commands}) -%}
      {%- else -%}
        {%- do tracks.append({'targetRow': target, 'commands': final_commands}) -%}
      {%- endif -%}
      {%- if audio_src == 'builtin' -%}
        {%- set device_volume = ((sound_vol / 100) * 21) | round(0) | int -%}
        {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
        {%- do tracks[0].commands.insert(0, sound_command) -%}
      {%- endif -%}
      {{- {'tracks': tracks} | to_json -}}
    {%- endmacro -%}
    {{- generate_sequence_payload(final_target_row, final_effect, final_text, final_duration, final_speed, final_restore_row, final_sound, final_volume, final_repeat, final_audio_source) -}}

sequence:
  - service: logbook.log
    data:
      name: "{{ blueprint.name }}"
      message: "Displaying text on {{ device_name }}: '{{ final_text }}'"
  - service: system_log.write
    data:
      level: info
      message: |
        Executing 'Display Text' blueprint with the following parameters:
        Device: {{ device_name }} ({{ device }})
        Target Row: {{ final_target_row }}
        Text: {{ final_text }}
        Effect: {{ final_effect }}
        Duration: {{ final_duration }}s
        Marquee Speed: {{ final_speed }}ms
        Audio Source: {{ final_audio_source }}
        Sound Effect: {{ final_sound }}
        Media File: {{ final_media_file }}
        Volume: {{ final_volume }}%
        Repeat: {{ final_repeat }}
        Restore Row: {{ final_restore_row }}
        MQTT Payload: {{ payload }}
  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ device_name }}/cmnd/sequencer"
      payload: "{{ payload }}"
  - choose:
      - conditions:
          - "{{ final_audio_source == 'media' and final_media_file != '' }}"
        sequence:
          - service: media_player.volume_set
            target:
              device_id: "{{ device }}"
            data:
              volume_level: "{{ final_volume / 100 }}"
          - service: media_player.play_media
            target:
              device_id: "{{ device }}"
            data:
              media_content_id: "{{ final_media_file }}"
              media_content_type: "audio/mpeg"