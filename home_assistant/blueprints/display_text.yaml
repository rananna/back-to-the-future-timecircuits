blueprint:
  name: "BTTF Time Circuits: Display Text"
  description: >-
    A blueprint for displaying a text message on the Time Circuits, with optional sound, volume, looping, and advanced effects.
  domain: script
  input:
    device:
      name: Time Circuits Device
      description: The BTTF Time Circuits device to control.
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "The display row(s) to show the message on."
      default: "TOP"
      selector:
        select:
          options:
            - { label: "Top Row (Destination Time)", value: "TOP" }
            - { label: "Middle Row (Present Time)", value: "MIDDLE" }
            - { label: "Bottom Row (Last Time Departed)", value: "BOTTOM" }
            - { label: "All Rows", value: "ALL" }

    text_to_display:
      name: "Text to Display"
      description: "The message to display. Supports templates."
      default: ""
      selector:
        text: {}

    effect:
      name: "Visual Effect"
      description: "The visual effect to use for the message."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse", value: "PULSE" }
            - { label: "Flash", value: "FLASH" }
            - { label: "Typewriter", value: "TYPEWRITER" }
            - { label: "Scramble Text", value: "SCRAMBLE_TEXT" }

    duration:
      name: "Display Duration (s)"
      description: "Duration for the 'Set Text', 'Pulse', and 'Flash' effects."
      default: 10
      selector:
        number: { min: 1, max: 300, unit_of_measurement: "s" }

    marquee_speed:
      name: "Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number: { min: 20, max: 1000, unit_of_measurement: "ms" }

    audio_source:
      name: "Audio Source"
      description: "Choose whether to play a sound with the visual effect."
      default: "none"
      selector:
        select:
          options:
            - { label: "None", value: "none" }
            - { label: "Built-in Sound Effect", value: "builtin" }
            - { label: "Stream from Home Assistant", value: "media" }

    sound_effect:
      name: "Sound Effect"
      description: "A built-in sound effect to play from the device."
      default: "sys_beep.mp3"
      selector:
        select:
          options:
            - { label: "System Beep", value: "sys_beep.mp3" }
            - { label: "Acceleration", value: "ACCELERATION.mp3" }
            - { label: "Arrival Chime", value: "arrival_chime.mp3" }
            - { label: "Electric Sparks", value: "electric_sparks.mp3" }
            - { label: "Engine Rev", value: "engine_rev.mp3" }
            - { label: "Flux Capacitor Power On", value: "flux_capacitor_power_on.mp3" }
            - { label: "Hum", value: "hum.mp3" }
            - { label: "Keypad Beeps", value: "keypad_beeps.mp3" }
            - { label: "Lock On", value: "lock_on.mp3" }
            - { label: "Relay Activation", value: "relay_activation.mp3" }
            - { label: "Time Travel", value: "time_travel.mp3" }

    media_file:
      name: "Media File"
      description: "Audio file to stream from the Home Assistant media library. Click 'Pick Media' to select."
      default: ""
      selector:
        media: {}

    volume:
      name: Volume
      description: "Set the volume for this specific alert (0-100). Only used if an audio source is selected."
      default: 80
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }

    repeat:
      name: "Repeat Count"
      description: "Number of times to repeat the alert. Built-in sounds will repeat; streamed audio will play once at the start."
      default: 1
      selector:
        number: { min: 1, max: 10, mode: box }

    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state after the effect (and any loops) completes."
      default: true
      selector:
        boolean: {}

mode: single

variables:
  device: !input device
  target_row: !input target_row
  text_to_display: !input text_to_display
  effect: !input effect
  duration: !input duration
  marquee_speed: !input marquee_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  volume: !input volume
  repeat: !input repeat
  restore_row: !input restore_row
  final_text: "{{ text_to_display | default('') }}"
  final_media_file: "{{ media_file | default('') }}"

sequence:
  - condition: template
    value_template: "{{ device != none }}"

  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ (device_attr(device, 'identifiers') | list | last)[1] }}/sequencer/command"
      payload: >-
        {%- macro generate_sequence_payload(target, effect, text, duration, speed, restore, sound, sound_vol, repeat_count, audio_src) -%}
          {%- set ns = namespace(final_commands=[], tracks=[]) -%}
          {%- set core_commands = [] -%}
          {%- set blocking_effects = ['MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT'] -%}
          {%- set timed_effects = ['PULSE', 'FLASH'] -%}
          {%- set visual_command = {'command': effect, 'targetSegment': -1, 'stringParam': text} -%}
          {%- if effect == 'MARQUEE' -%}
            {%- set visual_command = visual_command | merge({'intParam': speed | int}) -%}
          {%- elif effect in timed_effects -%}
            {%- set visual_command = visual_command | merge({'intParam': (duration * 1000) | int}) -%}
          {%- endif -%}
          {%- set core_commands = core_commands + [visual_command] -%}
          {%- if effect not in blocking_effects and effect not in timed_effects -%}
            {%- set wait_duration = (duration * 1000) | int -%}
            {%- set core_commands = core_commands + [{'command': 'WAIT', 'intParam': wait_duration}] -%}
          {%- endif -%}
          {%- if (repeat_count | int) > 1 -%}
            {%- set ns.final_commands = [{'command': 'LOOP_START', 'intParam': repeat_count | int}] + core_commands + [{'command': 'LOOP_END'}] -%}
          {%- else -%}
            {%- set ns.final_commands = core_commands -%}
          {%- endif -%}
          {%- if restore -%}
            {%- set ns.final_commands = ns.final_commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}
          {%- if target == 'ALL' -%}
            {%- set track_list = ['TOP', 'MIDDLE', 'BOTTOM'] -%}
          {%- else -%}
            {%- set track_list = [target] -%}
          {%- endif -%}
          {%- for row in track_list -%}
            {%- set current_commands = ns.final_commands -%}
            {%- if loop.first and audio_src == 'builtin' -%}
              {%- set device_volume = ((sound_vol / 100) * 21) | round(0) | int -%}
              {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
              {%- set current_commands = [sound_command] + current_commands -%}
            {%- endif -%}
            {%- set track_object = {'targetRow': row, 'commands': current_commands} -%}
            {%- set ns.tracks = ns.tracks + [track_object] -%}
          {%- endfor -%}
          {{- ns.tracks | to_json -}}
        {%- endmacro -%}
        {{- generate_sequence_payload(target_row, effect, final_text, duration, marquee_speed, restore_row, sound_effect, volume, repeat, audio_source) -}}

  - choose:
      - conditions:
          - "{{ audio_source == 'media' and final_media_file != '' }}"
        sequence:
          - variables:
              media_player_entity: >
                {{ device_entities(device) | select('startswith', 'media_player.') | first | default('none') }}
          - condition: template
            value_template: "{{ media_player_entity != 'none' }}"
          - service: media_player.volume_set
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              volume_level: "{{ volume / 100 }}"
          - service: media_player.play_media
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              media_content_id: "{{ final_media_file }}"
              media_content_type: "audio/mpeg"