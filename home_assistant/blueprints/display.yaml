blueprint:
  name: "BTTF Time Circuits: Display"
  description: >-
    **Display static text or an entity's state on the Time Circuits.**

    This is a powerful, all-in-one blueprint for showing information on the display.
    You can write a custom message, show the state of any Home Assistant entity, and apply various visual effects.
    It also supports sound, looping, and restoring the display to its previous state.
  domain: script
  input:
    # ----------------------------------------------------------------
    # --- Device and Target Inputs
    # ----------------------------------------------------------------
    device:
      name: Time Circuits Device
      description: "Select the BTTF Time Circuits device you want to control. This is the most important input!"
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "Choose which display row(s) the message should appear on. 'All Rows' will run the effect on all three rows simultaneously."
      default: "TOP"
      selector:
        select:
          options:
            - { label: "Top Row (Destination Time)", value: "TOP" }
            - { label: "Middle Row (Present Time)", value: "MIDDLE" }
            - { label: "Bottom Row (Last Time Departed)", value: "BOTTOM" }
            - { label: "All Rows", value: "ALL" }

    # ----------------------------------------------------------------
    # --- Data Source (The core choice: static text or dynamic entity)
    # ----------------------------------------------------------------
    data_source:
      name: "Data Source"
      description: "Choose what to display: a fixed message (Static Text) or the value of a sensor (Home Assistant Entity)."
      default: "static"
      selector:
        select:
          mode: dropdown
          options:
            - { label: "Static Text", value: "static" }
            - { label: "Home Assistant Entity", value: "entity" }

    # --- Static Text Inputs (only used if data_source is 'static') ---
    text_to_display:
      name: "[Static Text] Text to Display"
      description: "Enter the message to display. This field supports Home Assistant templates. This is only used if 'Data Source' is 'Static Text'."
      default: "HELLO WORLD"
      selector:
        text: {}

    # --- Entity Inputs (only used if data_source is 'entity') ---
    entity_to_display:
      name: "[Entity] Entity to Display"
      description: "Select the entity whose state or attribute you want to display. This is only used if 'Data Source' is 'Home Assistant Entity'."
      default: ""
      selector:
        entity: {}
    attribute_to_display:
      name: "[Entity] Attribute to Display"
      description: "Optional: If the entity has attributes, specify which one to display (e.g., 'temperature'). Leave blank to use the entity's main state."
      default: ""
      selector:
        text: {}
    prefix:
      name: "[Entity] Prefix"
      description: "Optional: Text to add *before* the entity's value (e.g., 'Temp: ')."
      default: ""
      selector:
        text: {}
    postfix:
      name: "[Entity] Postfix"
      description: "Optional: Text to add *after* the entity's value (e.g., '°C')."
      default: ""
      selector:
        text: {}

    # ----------------------------------------------------------------
    # --- Visual Effect Configuration
    # ----------------------------------------------------------------
    effect:
      name: "Visual Effect"
      description: "Choose the visual effect for displaying the text. See the device documentation for a demo of each effect."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse (2-second on/off cycle)", value: "PULSE" }
            - { label: "Flash (Fast blinking)", value: "FLASH" }
            - { label: "Typewriter (Reveals text character by character)", value: "TYPEWRITER" }
            - { label: "Scramble Text (Reveals text from a scramble)", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker (Flickers characters randomly)", value: "RANDOM_FLICKER_TEXT" }
    flicker_speed:
      name: "Flicker Speed (ms)"
      description: "Set the speed for the 'Random Flicker' effect. Lower is faster."
      default: 50
      selector:
        number: { min: 10, max: 1000, unit_of_measurement: "ms" }

    # ----------------------------------------------------------------
    # --- Audio Configuration
    # ----------------------------------------------------------------
    audio_source:
      name: "Audio Source"
      description: "Optional: Choose a sound to play along with the visual effect. 'Built-in' sounds play from the device's SD card. 'Stream from HA' plays from your HA media library."
      default: "none"
      selector:
        select:
          mode: dropdown
          options:
            - { label: "None", value: "none" }
            - { label: "Built-in Sound Effect", value: "builtin" }
            - { label: "Stream from Home Assistant", value: "media" }
    sound_effect:
      name: "Sound Effect"
      description: "Select a built-in sound effect to play from the device's SD card. This only applies if 'Built-in Sound Effect' is the selected audio source."
      default: "sys_beep.mp3"
      selector:
        select:
          options:
            - { label: "System Beep", value: "sys_beep.mp3" }
            - { label: "Arrival Chime", value: "arrival_chime.mp3" }
            - { label: "Electric Sparks", value: "electric_sparks.mp3" }
            - { label: "Engine Rev", value: "engine_rev.mp3" }
            - { label: "Flux Capacitor Power On", value: "flux_capacitor_power_on.mp3" }
            - { label: "Hum", value: "hum.mp3" }
            - { label: "Keypad Beeps", value: "keypad_beeps.mp3" }
            - { label: "Lock On", value: "lock_on.mp3" }
            - { label: "Relay Activation", value: "relay_activation.mp3" }
            - { label: "Time Travel", value: "time_travel.mp3" }
    media_file:
      name: "Media File"
      description: "Select an audio file from your Home Assistant media library to stream. This only applies if 'Stream from Home Assistant' is the selected audio source."
      default: ""
      selector:
        media: {}
    audio_output_player:
      name: "[Advanced] Audio Output Override"
      description: "Optional: Select a different media player for audio output. If left blank, the audio will play on the Time Circuits device itself."
      default: ""
      selector:
        entity:
          domain: media_player
    volume:
      name: Volume
      description: "Set the volume for the sound effect or streamed media (0-100). The blueprint converts this to the device's native volume scale."
      default: 80
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }

    # ----------------------------------------------------------------
    # --- Loop and Cleanup
    # ----------------------------------------------------------------
    repeat:
      name: "Repeat Count"
      description: "Number of times to repeat the visual effect and built-in sound. Note: Streamed audio from Home Assistant will only play once at the start."
      default: 1
      selector:
        number: { min: 1, max: 10, mode: box }
    restore_row:
      name: "Restore Row After"
      description: "If enabled, the display row will be restored to its previous state (e.g., the clock) after the sequence completes."
      default: true
      selector:
        boolean: {}

# ================================================================
# --- SCRIPT LOGIC (No need to edit below this line)
# ================================================================
mode: single

variables:
  # --- Collect all user inputs into variables for easier use ---
  device: !input device
  target_row: !input target_row
  data_source: !input data_source
  text_to_display: !input text_to_display
  entity_to_display: !input entity_to_display
  attribute_to_display: !input attribute_to_display
  prefix: !input prefix
  postfix: !input postfix
  effect: !input effect
  duration: 10
  flicker_speed: !input flicker_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  audio_output_player: !input audio_output_player
  volume: !input volume
  repeat: !input repeat
  restore_row: !input restore_row

  # --- Logic to determine the final text to be displayed ---
  # This is the core logic that makes the blueprint dynamic.
  value_to_display: >-
    {# If the user chose 'Static Text' as the source... #}
    {% if data_source == 'static' %}
      {# ...then simply use the static text input. #}
      {{ text_to_display }}
    {# If the user chose 'Entity' as the source... #}
    {% elif data_source == 'entity' %}
      {# ...and they actually provided an entity... #}
      {% if entity_to_display is defined and entity_to_display != '' %}
        {# ...then check if they specified an attribute. #}
        {% if attribute_to_display is defined and attribute_to_display != '' %}
          {# If yes, get the attribute's value. #}
          {{ state_attr(entity_to_display, attribute_to_display) }}
        {% else %}
          {# If no, get the entity's main state. #}
          {{ states(entity_to_display) }}
        {% endif %}
      {% else %}
        {# ...if they chose 'Entity' but didn't select one, default to an empty string to prevent errors. #}
        {{ "" }}
      {% endif %}
    {% endif %}
  # --- Construct the final string by adding the prefix and postfix ---
  final_text: >-
    {%- if value_to_display | default('', true) | string | trim != '' -%}
      {{- prefix ~ (value_to_display | default('')) ~ postfix -}}
    {%- else -%}
      {{- '' -}}
    {%- endif -%}

sequence:
  - condition: template
    value_template: "{{ device != none }}"
  - condition: template
    value_template: "{{ final_text | trim != '' }}"

  - parallel:
      # Action: Publish the generated sequencer command to the device via MQTT.
      - service: mqtt.publish
        data:
          topic: "bttf_time_circuits/{{ ((device_attr(device, 'identifiers') | list | last)[1]) | trim }}/sequencer/command"
          payload: >-
            {#-
              JINJA2 TEMPLATE LOGIC
              This template constructs the JSON payload for the device's sequencer command.
              It builds a series of commands based on the selected text, effect, and sound,
              then wraps them in a track structure targeting the selected display row(s).
              The final output is a JSON array of "track" objects.
            -#}
            {%- macro generate_sequence_payload(target, effect_type, text, dur, f_speed, restore, sound, sound_vol, repeat_count, audio_src) -%}
              {#- A namespace is used to hold the list of tracks as it's built. -#}
              {%- set ns = namespace(tracks=[]) -%}
              {%- set core_commands = [] -%}
              {#-
                Define which effects are self-timing, which are timed by the firmware,
                and which require a manual WAIT command.
              -#}
              {#-
                BRANCHING LOGIC FOR EFFECTS
                This block determines the correct command sequence and parameters for the selected effect
                based on the firmware's requirements.
              -#}
              {%- if effect_type == 'SET_TEXT' -%}
                {%- set core_commands = core_commands + [{'command': 'SET_TEXT', 'targetSegment': -1, 'stringParam': text}] -%}
                {%- set core_commands = core_commands + [{'command': 'WAIT', 'intParam': (dur * 1000)}] -%}

              {%- elif effect_type == 'RANDOM_FLICKER_TEXT' -%}
                {#- This is a non-blocking effect that requires two steps: set the text, then flicker it. -#}
                {%- set set_text_cmd = {'command': 'SET_TEXT', 'targetSegment': -1, 'stringParam': text} -%}
                {%- set flicker_cmd = {'command': 'RANDOM_FLICKER_TEXT', 'targetSegment': -1, 'stringParam': "", 'intParam': f_speed, 'intParam2': (dur * 1000)} -%}
                {%- set wait_cmd = {'command': 'WAIT', 'intParam': (dur * 1000)} -%}
                {%- set core_commands = core_commands + [set_text_cmd, flicker_cmd, wait_cmd] -%}

              {%- elif effect_type == 'SCRAMBLE_TEXT' -%}
                {#- This is a blocking effect. `intParam` is flicker speed, `intParam2` is lock-in speed per character. -#}
                {%- set lock_in_delay = ([((dur * 1000) / ([text | length, 1] | max)), 20] | max) | int -%}
                {%- set scramble_cmd = {'command': 'SCRAMBLE_TEXT', 'targetSegment': -1, 'stringParam': text, 'intParam': 50, 'intParam2': lock_in_delay} -%}
                {%- set wait_cmd = {'command': 'WAIT', 'intParam': 1000} -%}
                {%- set core_commands = core_commands + [scramble_cmd, wait_cmd] -%}

              {%- elif effect_type == 'TYPEWRITER' -%}
                {#- This is a blocking effect. `intParam` is the delay per character. -#}
                {%- set char_delay = ([((dur * 1000) / ([text | length, 1] | max)), 20] | max) | int -%}
                {%- set typewriter_cmd = {'command': 'TYPEWRITER', 'targetSegment': -1, 'stringParam': text, 'intParam': char_delay} -%}
                {%- set wait_cmd = {'command': 'WAIT', 'intParam': 1000} -%}
                {%- set core_commands = core_commands + [typewriter_cmd, wait_cmd] -%}

              {%- elif effect_type == 'MARQUEE' -%}
                {#- This is a blocking effect. `intParam` is the scroll speed per step. -#}
                {%- set scroll_distance = 13 + (text | length) -%}
                {%- set scroll_speed = ([((dur * 1000) / scroll_distance), 20] | max) | int -%}
                {%- set marquee_cmd = {'command': 'MARQUEE', 'targetSegment': -1, 'stringParam': text, 'intParam': scroll_speed} -%}
                {%- set core_commands = core_commands + [marquee_cmd] -%}

              {%- elif effect_type == 'PULSE' or effect_type == 'FLASH' -%}
                {#- These are blocking effects. `intParam2` is the total duration. -#}
                {%- set effect_cmd = {'command': effect_type, 'targetSegment': -1, 'stringParam': text, 'intParam2': (dur * 1000)} -%}
                {%- set core_commands = core_commands + [effect_cmd] -%}
              {%- endif -%}

              {# --- STEP 3: Wrap the core commands in a loop if requested --- #}
              {%- if (repeat_count | int) > 1 -%}
                {%- set final_commands = [{'command': 'LOOP_START', 'intParam': repeat_count | int}] + core_commands + [{'command': 'LOOP_END'}] -%}
              {%- else -%}
                {%- set final_commands = core_commands -%}
              {%- endif -%}

              {# --- STEP 4: Add the restore command if requested --- #}
              {%- if restore -%}
                {#- `RESTORE_ROW` tells the device to revert the display to its previous state (e.g., the clock). -#}
                {%- set final_commands = final_commands + [{'command': 'RESTORE_ROW'}] -%}
              {%- endif -%}

              {# --- STEP 5: Generate the final track objects for each target row --- #}
              {#- If 'ALL' is selected, create a list of all three rows. Otherwise, use the single selected row. -#}
              {%- set track_list = ['TOP', 'MIDDLE', 'BOTTOM'] if target == 'ALL' else [target] -%}
              {%- for row in track_list -%}
                {%- set current_commands = final_commands -%}
                {#-
                  Add the sound command to the beginning of the sequence.
                  We only add it to the first track (if `target` is 'ALL') to prevent it from playing multiple times.
                -#}
                {%- if loop.first and audio_src == 'builtin' -%}
                  {#- Convert HA's 0-100 volume to the device's 0-21 scale. -#}
                  {%- set device_volume = ((sound_vol / 100) * 21) | round(0) | int -%}
                  {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
                  {%- set current_commands = [sound_command] + current_commands -%}
                {%- endif -%}
                {%- set track_object = {'targetRow': row, 'commands': current_commands} -%}
                {%- set ns.tracks = ns.tracks + [track_object] -%}
              {%- endfor -%}

              {# --- STEP 6: Return the raw JSON array of tracks --- #}
              {#- The `to_json` filter converts the Python list of dictionaries into a valid JSON string. -#}
              {{- ns.tracks | to_json -}}
            {%- endmacro -%}
            {#- Call the macro with all the user inputs and the derived `final_text` to generate the payload. -#}
            {{- generate_sequence_payload(target_row, effect, final_text, duration, flicker_speed, restore_row, sound_effect, volume, repeat, audio_source) -}}

      # Action: Handle streaming audio from Home Assistant.
      - if:
          - condition: template
            value_template: "{{ audio_source == 'media' and media_file != '' }}"
        then:
          - variables:
              target_player: >-
                {% if audio_output_player is defined and audio_output_player != '' %}
                  {{ audio_output_player }}
                {% else %}
                  {{ device_entities(device) | select('startswith', 'media_player.') | first | default('none') }}
                {% endif %}
          - condition: template
            value_template: "{{ target_player != 'none' }}"
          - service: media_player.volume_set
            target:
              entity_id: "{{ target_player }}"
            data:
              volume_level: "{{ volume / 100 }}"
          - service: media_player.play_media
            target:
              entity_id: "{{ target_player }}"
            data:
              media_content_id: !input media_file
              media_content_type: "music"
