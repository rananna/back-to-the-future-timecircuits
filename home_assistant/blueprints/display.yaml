blueprint:
  name: "BTTF Time Circuits: Display"
  description: >-
    A comprehensive blueprint for displaying static text or an entity's state on the Time Circuits.
    Supports optional sound, volume, looping, and advanced visual effects.
    This blueprint merges the functionality of the old 'Display Text' and 'Display Entity' blueprints.
  domain: script
  input:
    device:
      name: Time Circuits Device
      description: The BTTF Time Circuits device to control.
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "The display row(s) to show the message on."
      default: "TOP"
      selector:
        select:
          options:
            - { label: "Top Row (Destination Time)", value: "TOP" }
            - { label: "Middle Row (Present Time)", value: "MIDDLE" }
            - { label: "Bottom Row (Last Time Departed)", value: "BOTTOM" }
            - { label: "All Rows", value: "ALL" }

    data_source:
      name: "Data Source"
      description: "Choose what to display. This will show/hide other options below."
      default: "static"
      selector:
        select:
          options:
            - { label: "Static Text", value: "static" }
            - { label: "Home Assistant Entity", value: "entity" }

    # --- Static Text Inputs (Visible when Data Source is 'Static Text') ---
    text_to_display:
      name: "Text to Display"
      description: "The message to display. Supports templates."
      default: ""
      selector:
        text: {}

    # --- Entity Inputs (Visible when Data Source is 'Home Assistant Entity') ---
    entity_to_display:
      name: "Entity to Display"
      description: "The entity to display."
      default: "" # Must have a default to avoid errors when hidden by the data_source selector
      selector:
        entity: {}
    attribute_to_display:
      name: "Attribute to Display (Optional)"
      description: "The specific attribute to display. Leave blank to use the entity's main state."
      default: ""
      selector:
        text: {}
    prefix:
      name: "Prefix"
      description: "Optional text to display before the value (e.g., 'Temp: ')."
      default: ""
      selector:
        text: {}
    postfix:
      name: "Postfix"
      description: "Optional text to display after the value (e.g., '°C')."
      default: ""
      selector:
        text: {}

    # --- Common Effect Inputs ---
    effect:
      name: "Visual Effect"
      description: "The visual effect to use for the message."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse", value: "PULSE" }
            - { label: "Flash", value: "FLASH" }
            - { label: "Typewriter", value: "TYPEWRITER" }
            - { label: "Scramble Text", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker", value: "RANDOM_FLICKER_TEXT" }

    duration:
      name: "Display Duration (s)"
      description: "Duration for the 'Set Text', 'Pulse', and 'Flash' effects."
      default: 10
      selector:
        number: { min: 1, max: 300, unit_of_measurement: "s" }

    marquee_speed:
      name: "Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number: { min: 20, max: 1000, unit_of_measurement: "ms" }

    flicker_speed:
      name: "Flicker Speed (ms)"
      description: "The speed for the 'Random Flicker' effect. Lower is faster."
      default: 50
      selector:
        number: { min: 10, max: 1000, unit_of_measurement: "ms" }

    # --- Audio Inputs ---
    audio_source:
      name: "Audio Source"
      description: "Choose whether to play a sound with the visual effect."
      default: "none"
      selector:
        select:
          options:
            - { label: "None", value: "none" }
            - { label: "Built-in Sound Effect", value: "builtin" }
            - { label: "Stream from Home Assistant", value: "media" }

    sound_effect:
      name: "Sound Effect"
      description: "A built-in sound effect to play from the device."
      default: "sys_beep.mp3"
      selector:
        select:
          options:
            - { label: "System Beep", value: "sys_beep.mp3" }
            - { label: "Arrival Chime", value: "arrival_chime.mp3" }
            - { label: "Electric Sparks", value: "electric_sparks.mp3" }
            - { label: "Engine Rev", value: "engine_rev.mp3" }
            - { label: "Flux Capacitor Power On", value: "flux_capacitor_power_on.mp3" }
            - { label: "Hum", value: "hum.mp3" }
            - { label: "Keypad Beeps", value: "keypad_beeps.mp3" }
            - { label: "Lock On", value: "lock_on.mp3" }
            - { label: "Relay Activation", value: "relay_activation.mp3" }
            - { label: "Time Travel", value: "time_travel.mp3" }

    media_file:
      name: "Media File"
      description: "Audio file to stream from the Home Assistant media library."
      default: ""
      selector:
        media: {}

    volume:
      name: Volume
      description: "Set the volume for this specific alert (0-100). Only used if an audio source is selected."
      default: 80
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }

    # --- Looping and Restore ---
    repeat:
      name: "Repeat Count"
      description: "Number of times to repeat the alert. Built-in sounds will repeat; streamed audio will play once at the start."
      default: 1
      selector:
        number: { min: 1, max: 10, mode: box }

    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state after the effect (and any loops) completes."
      default: true
      selector:
        boolean: {}

mode: single

variables:
  # --- Input Aliases (defaults are handled in the input section) ---
  device: !input device
  target_row: !input target_row
  data_source: !input data_source
  text_to_display: !input text_to_display
  entity_to_display: !input entity_to_display
  attribute_to_display: !input attribute_to_display
  prefix: !input prefix
  postfix: !input postfix
  effect: !input effect
  duration: !input duration
  marquee_speed: !input marquee_speed
  flicker_speed: !input flicker_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  volume: !input volume
  repeat: !input repeat
  restore_row: !input restore_row

  # --- Logic ---
  # Determine the final text based on the data source
  value_to_display: >-
    {% if data_source == 'entity' and entity_to_display != "" %}
      {% if attribute_to_display != "" %}
        {{ state_attr(entity_to_display, attribute_to_display) }}
      {% else %}
        {{ states(entity_to_display) }}
      {% endif %}
    {% else %}
      {{ text_to_display }}
    {% endif %}
  final_text: "{{- prefix ~ (value_to_display | default('')) ~ postfix -}}"

sequence:
  - condition: template
    value_template: "{{ device != none }}"
    error_message: "Please select a Time Circuits device to control."

  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ (device_attr(device, 'identifiers') | list | last)[1] }}/sequencer/command"
      payload_template: >-
        {%- macro generate_sequence_payload(target, effect_type, text, dur, m_speed, f_speed, restore, sound, sound_vol, repeat_count, audio_src) -%}
          {%- set ns = namespace(tracks=[]) -%}
          {%- set core_commands = [] -%}
          {%- set blocking_effects = ['MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT', 'RANDOM_FLICKER_TEXT'] -%}
          {%- set timed_effects = ['PULSE', 'FLASH'] -%}

          {# --- Build the main visual command --- #}
          {%- set visual_command = {'command': effect_type, 'targetSegment': -1, 'stringParam': text} -%}
          {%- if effect_type == 'MARQUEE' -%}
            {%- set visual_command = dict(visual_command, intParam=m_speed | int) -%}
          {%- elif effect_type == 'RANDOM_FLICKER_TEXT' -%}
             {%- set visual_command = dict(visual_command, intParam=f_speed | int) -%}
          {%- elif effect_type in timed_effects -%}
            {# Pulse and Flash use intParam2 for duration #}
            {%- set visual_command = dict(visual_command, intParam2=(dur * 1000) | int) -%}
          {%- endif -%}
          {%- set core_commands = core_commands + [visual_command] -%}

          {# --- Add a WAIT for non-blocking/non-timed effects --- #}
          {%- if effect_type not in blocking_effects and effect_type not in timed_effects -%}
            {%- set wait_duration = (dur * 1000) | int -%}
            {%- set core_commands = core_commands + [{'command': 'WAIT', 'intParam': wait_duration}] -%}
          {%- endif -%}

          {# --- Wrap in a loop if needed --- #}
          {%- if (repeat_count | int) > 1 -%}
            {%- set final_commands = [{'command': 'LOOP_START', 'intParam': repeat_count | int}] + core_commands + [{'command': 'LOOP_END'}] -%}
          {%- else -%}
            {%- set final_commands = core_commands -%}
          {%- endif -%}

          {# --- Add restore command if needed --- #}
          {%- if restore -%}
            {%- set final_commands = final_commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}

          {# --- Generate tracks for target rows --- #}
          {%- set track_list = ['TOP', 'MIDDLE', 'BOTTOM'] if target == 'ALL' else [target] -%}
          {%- for row in track_list -%}
            {%- set current_commands = final_commands -%}
            {%- if loop.first and audio_src == 'builtin' -%}
              {%- set device_volume = ((sound_vol / 100) * 21) | round(0) | int -%}
              {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
              {%- set current_commands = [sound_command] + current_commands -%}
            {%- endif -%}
            {%- set track_object = {'targetRow': row, 'commands': current_commands} -%}
            {%- set ns.tracks = ns.tracks + [track_object] -%}
          {%- endfor -%}

          {# --- Return the raw JSON array --- #}
          {{- ns.tracks | to_json -}}
        {%- endmacro -%}
        {{- generate_sequence_payload(target_row, effect, final_text, duration, marquee_speed, flicker_speed, restore_row, sound_effect, volume, repeat, audio_source) -}}

  - choose:
      - conditions:
          - "{{ audio_source == 'media' and media_file != '' }}"
        sequence:
          - variables:
              media_player_entity: >
                {{ device_entities(device) | select('startswith', 'media_player.') | first | default('none') }}
          - condition: template
            value_template: "{{ media_player_entity != 'none' }}"
            error_message: "Could not find a media_player entity for the selected device."
          - service: media_player.volume_set
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              volume_level: "{{ volume / 100 }}"
          - service: media_player.play_media
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              media_content_id: !input media_file
              media_content_type: "audio/mpeg"