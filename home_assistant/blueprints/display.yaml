blueprint:
  name: "BTTF Time Circuits: Display"
  description: >-
    # BTTF Time Circuits: General Purpose Display

    This is a powerful and flexible blueprint for displaying information on your Time Circuits clock.
    It can show static text (like a custom message) or dynamically display the state of any Home Assistant entity.

    **Key Features:**
    - Display static text or the state/attribute of an entity.
    - Add custom prefixes and postfixes (e.g., "Temp: 25°C").
    - Choose from a wide variety of visual effects (static, scrolling, pulse, flash, etc.).
    - Play a built-in sound effect or stream audio from Home Assistant.
    - Loop the visual effect and sound.
    - Automatically restore the display to its previous state when finished.
  domain: script
  input:
    device:
      name: Time Circuits Device
      description: The BTTF Time Circuits device to control. This is the only required input.
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "The display row(s) to show the message on. 'All Rows' will display the same message on all three rows."
      default: "TOP"
      selector:
        select:
          options:
            - { label: "Top Row (Destination Time)", value: "TOP" }
            - { label: "Middle Row (Present Time)", value: "MIDDLE" }
            - { label: "Bottom Row (Last Time Departed)", value: "BOTTOM" }
            - { label: "All Rows", value: "ALL" }

    data_source:
      name: Data Source
      description: "Choose the source of the text to display. This will show/hide the relevant options below."
      default: "static"
      selector:
        select:
          options:
            - { label: "Static Text", value: "static" }
            - { label: "Home Assistant Entity", value: "entity" }

    text_to_display:
      name: "Text to Display"
      description: "The static message to display. Supports Home Assistant templates. This is only used if 'Data Source' is 'Static Text'."
      default: ""
      selector:
        text: {}

    entity_to_display:
      name: "Entity to Display"
      description: "The entity whose state or attribute you want to display. This is only used if 'Data Source' is 'Home Assistant Entity'."
      default: ""
      selector:
        entity: {}
    attribute_to_display:
      name: "Attribute to Display (Optional)"
      description: "The specific attribute of the selected entity to display. Leave blank to use the entity's main state."
      default: ""
      selector:
        text: {}
    prefix:
      name: "Prefix"
      description: "Optional text to display before the entity value (e.g., 'Temp: ')."
      default: ""
      selector:
        text: {}
    postfix:
      name: "Postfix"
      description: "Optional text to display after the entity value (e.g., '°C')."
      default: ""
      selector:
        text: {}

    effect:
      name: "Visual Effect"
      description: "The visual effect to use for displaying the text."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse (2-second on/off cycle)", value: "PULSE" }
            - { label: "Flash (Rapid blinking)", value: "FLASH" }
            - { label: "Typewriter (Reveals text character by character)", value: "TYPEWRITER" }
            - { label: "Scramble Text (Reveals text from random characters)", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker (Flickers text with random characters)", value: "RANDOM_FLICKER_TEXT" }

    duration:
      name: "Display Duration (s)"
      description: "Total duration in seconds for the 'Set Text', 'Pulse', 'Flash', 'Typewriter', and 'Scramble' effects. This does not apply to the 'Marquee' or 'Random Flicker' effects."
      default: 10
      selector:
        number: { min: 1, max: 60, unit_of_measurement: "s" }

    marquee_speed:
      name: "Marquee Speed (ms)"
      description: "The scroll speed for the Marquee effect. Lower is faster. This only applies if 'Marquee' is selected."
      default: 100
      selector:
        number: { min: 20, max: 1000, unit_of_measurement: "ms" }

    flicker_speed:
      name: "Random Flicker Speed (ms)"
      description: "For the Random Flicker effect, this is the delay between screen updates. Lower is faster. This only applies if 'Random Flicker' is selected."
      default: 50
      selector:
        number: { min: 20, max: 1000, unit_of_measurement: "ms" }

    audio_source:
      name: "Audio Source"
      description: "Choose whether to play a sound with the visual effect. 'Built-in' sounds play concurrently with the visual effect. 'Streamed' audio plays after the visual effect starts."
      default: "none"
      selector:
        select:
          options:
            - { label: "None", value: "none" }
            - { label: "Built-in Sound Effect", value: "builtin" }
            - { label: "Stream from Home Assistant", value: "media" }

    sound_effect:
      name: "Sound Effect"
      description: "A built-in sound effect to play from the device's internal storage. Only used if 'Built-in Sound Effect' is selected."
      default: "sys_beep.mp3"
      selector:
        select:
          options:
            - { label: "System Beep", value: "sys_beep.mp3" }
            - { label: "Acceleration", value: "ACCELERATION.mp3" }
            - { label: "Arrival Chime", value: "arrival_chime.mp3" }
            - { label: "Electric Sparks", value: "electric_sparks.mp3" }
            - { label: "Engine Rev", value: "engine_rev.mp3" }
            - { label: "Flux Capacitor Power On", value: "flux_capacitor_power_on.mp3" }
            - { label: "Hum", value: "hum.mp3" }
            - { label: "Keypad Beeps", value: "keypad_beeps.mp3" }
            - { label: "Lock On", value: "lock_on.mp3" }
            - { label: "Relay Activation", value: "relay_activation.mp3" }
            - { label: "Time Travel", value: "time_travel.mp3" }

    media_file:
      name: "Media File"
      description: "Audio file to stream from the Home Assistant media library. Click 'Pick Media' to select. Only used if 'Stream from Home Assistant' is selected."
      default: ""
      selector:
        media: {}

    volume:
      name: Volume
      description: "Set the volume for this specific alert (0-100). Only used if an audio source is selected."
      default: 80
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }

    repeat:
      name: "Repeat Count"
      description: "Number of times to repeat the visual effect. Built-in sounds will also repeat; streamed audio will only play once at the start."
      default: 1
      selector:
        number: { min: 1, max: 10, mode: box }

    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the display row will be restored to its previous state (e.g., showing the clock) after the effect (and any loops) completes."
      default: true
      selector:
        boolean: {}

mode: single

variables:
  device: !input device
  target_row: !input target_row
  data_source: !input data_source
  text_to_display: !input text_to_display
  entity_to_display: !input entity_to_display
  attribute_to_display: !input attribute_to_display
  prefix: !input prefix
  postfix: !input postfix
  effect: !input effect
  duration: !input duration
  marquee_speed: !input marquee_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  volume: !input volume
  repeat: !input repeat
  restore_row: !input restore_row
  flicker_speed: !input flicker_speed

sequence:
  - variables:
      device_id: "{{ (device_attr(device, 'identifiers') | list | last)[1] }}"
      final_media_file: "{{ media_file if audio_source == 'media' else '' }}"
      entity_value: >-
        {% if data_source == 'entity' and entity_to_display != '' %}
          {% if attribute_to_display != '' %}
            {{ state_attr(entity_to_display, attribute_to_display) }}
          {% else %}
            {{ states(entity_to_display) }}
          {% endif %}
        {% else %}
          {{ '' }}
        {% endif %}
      final_text: >-
        {% if data_source == 'entity' %}
          {{ prefix ~ entity_value ~ postfix }}
        {% else %}
          {{ text_to_display }}
        {% endif %}

  - condition: template
    value_template: "{{ device_id != none and final_text != '' }}"

  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ device_id }}/sequencer/command"
      payload: >-
        {%- macro generate_sequence_payload(target, effect_val, text, duration_val, speed, restore_val, sound, sound_vol, repeat_count, audio_src, flicker_spd) -%}
          {%- set ns = namespace(final_commands=[], tracks=[]) -%}
          {%- set core_commands = [] -%}
          {%- set self_blocking_effects = ['MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT', 'PULSE', 'FLASH', 'RANDOM_FLICKER_TEXT'] -%}
          {%- set text_len = text | length -%}
          {%- set duration_ms = (duration_val * 1000) | int -%}

          {%- set base_command = {'command': effect_val, 'targetSegment': -1, 'stringParam': text} -%}

          {%- if effect_val == 'MARQUEE' -%}
            {%- set visual_command = dict(base_command, intParam=speed | int) -%}
          {%- elif effect_val == 'PULSE' -%}
            {%- set visual_command = dict(base_command, intParam=1000, intParam2=duration_ms) -%}
          {%- elif effect_val == 'FLASH' -%}
            {%- set visual_command = dict(base_command, intParam2=duration_ms) -%}
          {%- elif effect_val == 'TYPEWRITER' and text_len > 0 -%}
            {%- set type_speed = (duration_ms / text_len) | int -%}
            {%- set visual_command = dict(base_command, intParam=type_speed) -%}
          {%- elif effect_val == 'SCRAMBLE_TEXT' and text_len > 0 -%}
            {%- set scramble_speed = (duration_ms / text_len) | int -%}
            {%- set visual_command = dict(base_command, intParam=50, intParam2=scramble_speed) -%}
          {%- elif effect_val == 'RANDOM_FLICKER_TEXT' -%}
            {%- set visual_command = dict(base_command, intParam=flicker_spd | int, intParam2=duration_ms) -%}
          {%- else -%}
            {%- set visual_command = base_command -%}
          {%- endif -%}
          {%- set core_commands = core_commands + [visual_command] -%}

          {%- if effect_val not in self_blocking_effects -%}
            {%- set core_commands = core_commands + [{'command': 'WAIT', 'intParam': duration_ms}] -%}
          {%- endif -%}

          {%- if (repeat_count | int) > 1 -%}
            {%- set ns.final_commands = [{'command': 'LOOP_START', 'intParam': repeat_count | int}] + core_commands + [{'command': 'LOOP_END'}] -%}
          {%- else -%}
            {%- set ns.final_commands = core_commands -%}
          {%- endif -%}

          {%- if restore_val -%}
            {%- set ns.final_commands = ns.final_commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}

          {%- if target == 'ALL' -%}
            {%- set track_list = ['TOP', 'MIDDLE', 'BOTTOM'] -%}
          {%- else -%}
            {%- set track_list = [target] -%}
          {%- endif -%}

          {%- for row in track_list -%}
            {%- set current_commands = ns.final_commands -%}
            {%- if loop.first and audio_src == 'builtin' -%}
              {%- set device_volume = ((sound_vol / 100) * 21) | round(0) | int -%}
              {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
              {%- set current_commands = [sound_command] + current_commands -%}
            {%- endif -%}
            {%- set track_object = {'targetRow': row, 'commands': current_commands} -%}
            {%- set ns.tracks = ns.tracks + [track_object] -%}
          {%- endfor -%}

          {{- ns.tracks | to_json -}}
        {%- endmacro -%}
        {{- generate_sequence_payload(target_row, effect, final_text, duration, marquee_speed, restore_row, sound_effect, volume, repeat, audio_source, flicker_speed) -}}

  - choose:
      - conditions:
          - "{{ audio_source == 'media' and final_media_file != '' }}"
        sequence:
          - variables:
              media_player_entity: >
                {{ device_entities(device_id) | select('startswith', 'media_player.') | first | default('none') }}
          - condition: template
            value_template: "{{ media_player_entity != 'none' }}"
          - service: media_player.volume_set
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              volume_level: "{{ volume / 100 }}"
          - service: media_player.play_media
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              media_content_id: "{{ final_media_file }}"
              media_content_type: "audio/mpeg"