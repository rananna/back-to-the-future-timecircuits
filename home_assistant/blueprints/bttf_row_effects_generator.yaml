blueprint:
  name: BTTF Time Circuits - Row Effects Generator
  description: >-
    Runs a one-shot, attention-grabbing effect on an entire row, like a slow pulse or a rapid flash, for a specific duration.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to apply the effect to.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    effect:
      name: Row Effect
      description: "Select the effect to run on the row."
      default: "PULSE"
      selector:
        select:
          options:
            - label: "Pulse (slower throb)"
              value: "PULSE"
            - label: "Flash (rapid blink)"
              value: "FLASH"
    duration:
      name: Effect Duration (seconds)
      description: "How long the effect should run before the row is restored."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: "s"

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set steps = [
          {
            "command": effect,
            "targetRow": target_row,
            "targetSegment": -1,
            "intParam": (duration * 1000) | int
          },
          {
            "command": "RESTORE_ROW",
            "targetRow": target_row
          }
        ] -%}
        {{ {"tracks": [steps]} | to_json }}