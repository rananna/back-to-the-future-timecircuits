blueprint:
  name: BTTF Time Circuits - Marquee Text Sequence
  description: >-
    Creates a script to run a scrolling marquee animation on one of the display rows.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to show the marquee on.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    text_to_display:
      name: Text to Scroll
      description: "The text to scroll across the selected row. Supports Home Assistant templates."
      selector:
        text:
    speed:
      name: Marquee Speed (milliseconds)
      description: "The delay between each step of the scroll, in milliseconds. A lower number means faster scrolling."
      default: 75
      selector:
        number:
          min: 20
          max: 500
          unit_of_measurement: "ms"
    restore_row:
      name: Restore Row After Marquee
      description: "If enabled, the row will be restored to its previous state after the marquee finishes."
      default: true
      selector:
        boolean: {}

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set steps = [
          {
            "command": "MARQUEE",
            "targetRow": target_row,
            "targetSegment": -1,
            "stringParam": text_to_display,
            "intParam": speed
          }
        ] -%}
        {%- if restore_row -%}
          {# The marquee animation is text length + 13 steps. Wait for it to finish. #}
          {%- set wait_duration = ((text_to_display | length) + 13) * speed -%}
          {%- set steps = steps + [
            {"command": "WAIT", "intParam": wait_duration | int},
            {"command": "RESTORE_ROW", "targetRow": target_row}
          ] -%}
        {%- endif -%}
        {{ {"tracks": [steps]} | to_json }}