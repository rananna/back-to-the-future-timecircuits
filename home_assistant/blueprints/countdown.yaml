blueprint:
  name: "BTTF Time Circuits: Countdown Timer"
  description: A blueprint to run a countdown on one of the display rows.
  domain: script
  input:
    base_topic:
      name: MQTT Base Topic
      description: The base topic for your Time Circuits MQTT integration.
      default: "bttf-time-circuits"
    device_id:
      name: Device ID
      description: The unique device ID for your Time Circuits clock.
    target_row:
      name: Target Row
      description: "The display row to show the countdown on."
      default: "TOP"
      selector:
        select:
          options:
            - label: "Top Row (Destination Time)"
              value: "TOP"
            - label: "Middle Row (Present Time)"
              value: "MIDDLE"
            - label: "Bottom Row (Last Time Departed)"
              value: "BOTTOM"
    start_number:
      name: "Start Number"
      description: "The number to start counting down from."
      default: 10
      selector:
        number:
          min: 1
          max: 9999
    countdown_delay:
      name: "Countdown Delay (ms)"
      description: "The delay between each number change. 1000ms = 1 second."
      default: 1000
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: "ms"
    end_text:
      name: "End Text"
      description: "Optional text to display when the countdown finishes."
      default: "LIFTOFF"
    end_text_effect:
      name: "End Text Effect"
      description: "The visual effect to use for the end text."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text (Static)"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Pulse"
              value: "PULSE"
            - label: "Flash"
              value: "FLASH"
    end_text_marquee_speed:
      name: "End Text Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    end_text_duration:
      name: "End Text Display Duration (s)"
      description: "Duration for Set Text, Pulse, and Flash effects."
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state."
      default: true
      selector:
        boolean: {}

mode: single

sequence:
  - service: mqtt.publish
    data:
      topic: "{{ base_topic }}/{{ device_id }}/cmnd/sequencer"
      payload: >
        {%- macro generate_countdown_payload() -%}
          {%- set commands = [] -%}
          {%- set countdown_command = {'command': 'COUNTDOWN', 'targetSegment': -1, 'intParam': start_number, 'intParam2': countdown_delay} -%}
          {%- set commands = commands + [countdown_command] -%}

          {%- if end_text != "" -%}
            {# Create the base command for the end text #}
            {%- set end_text_command = {'command': end_text_effect, 'targetSegment': -1, 'stringParam': end_text} -%}

            {# Set parameters based on the chosen effect #}
            {%- if end_text_effect == 'MARQUEE' -%}
              {%- do end_text_command.update({'intParam': end_text_marquee_speed}) -%}
            {%- elif end_text_effect in ['PULSE', 'FLASH'] -%}
              {%- do end_text_command.update({'intParam': end_text_duration * 1000}) -%}
            {%- endif -%}

            {# Add the main command for the end text #}
            {%- set commands = commands + [end_text_command] -%}

            {# Non-blocking effects require a WAIT command to be effective #}
            {%- set wait_duration = namespace(ms=0) -%}
            {%- if end_text_effect == 'SET_TEXT' -%}
              {# Static text needs a wait to be visible for the specified duration #}
              {%- set wait_duration.ms = end_text_duration * 1000 -%}
            {%- endif -%}

            {# Add WAIT command if a duration was calculated #}
            {%- if wait_duration.ms > 0 -%}
              {%- set commands = commands + [{'command': 'WAIT', 'intParam': wait_duration.ms | int}] -%}
            {%- endif -%}
          {%- endif -%}

          {%- if restore_row -%}
            {%- set commands = commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}

          {{- {'tracks': [{'targetRow': target_row, 'commands': commands}]} | to_json -}}
        {%- endmacro -%}

        {{- generate_countdown_payload() -}}