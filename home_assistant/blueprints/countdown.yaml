blueprint:
  name: "BTTF Time Circuits: Countdown Timer"
  description: >-
    **Run a numeric countdown on the Time Circuits display.**

    This blueprint allows you to start a countdown from a specified number.
    When the countdown finishes, you can display custom text with a visual effect, play a sound, and loop the final effect.
    It's perfect for alerts, timers, or just for fun.
  domain: script
  input:
    # ----------------------------------------------------------------
    # --- Device and Target Inputs
    # ----------------------------------------------------------------
    device:
      name: Time Circuits Device
      description: "Select the BTTF Time Circuits device you want to control. This is the most important input!"
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "Choose which display row(s) the countdown should appear on. 'All Rows' will run the countdown on all three rows simultaneously."
      default: "TOP"
      selector:
        select:
          options:
            - { label: "Top Row (Destination Time)", value: "TOP" }
            - { label: "Middle Row (Present Time)", value: "MIDDLE" }
            - { label: "Bottom Row (Last Time Departed)", value: "BOTTOM" }
            - { label: "All Rows", value: "ALL" }

    # ----------------------------------------------------------------
    # --- Countdown Configuration
    # ----------------------------------------------------------------
    start_number:
      name: "Start Number"
      description: "The number to begin counting down from (e.g., 10). The device's COUNTDOWN command handles the numeric decrementing."
      default: 10
      selector:
        number: { min: 1, max: 9999 }
    countdown_delay:
      name: "Countdown Delay (ms)"
      description: "The delay between each number change, in milliseconds. 1000ms = 1 second."
      default: 1000
      selector:
        number: { min: 50, max: 5000, unit_of_measurement: "ms" }

    # ----------------------------------------------------------------
    # --- End Text Configuration (what happens after the countdown)
    # ----------------------------------------------------------------
    end_text:
      name: "End Text"
      description: "Optional: Text to display when the countdown reaches zero (e.g., 'LAUNCH'). Supports Home Assistant templates."
      default: "LIFTOFF"
      selector:
        text: {}
    end_text_effect:
      name: "End Text Visual Effect"
      description: "Choose the visual effect for the end text. See the device documentation for a demo of each effect."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse (2-second on/off cycle)", value: "PULSE" }
            - { label: "Flash (Fast blinking)", value: "FLASH" }
            - { label: "Typewriter (Reveals text character by character)", value: "TYPEWRITER" }
            - { label: "Scramble Text (Reveals text from a scramble)", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker (Flickers characters randomly)", value: "RANDOM_FLICKER_TEXT" }
    end_text_duration:
      name: "End Text Display Duration (s)"
      description: "Set the display duration for 'Set Text', 'Pulse', 'Flash', 'Scramble', 'Typewriter', and 'Random Flicker' effects. Other effects are self-timing."
      default: 5
      selector:
        number: { min: 1, max: 60, unit_of_measurement: "s" }
    end_text_marquee_speed:
      name: "End Text Marquee Speed (ms)"
      description: "Set the scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number: { min: 20, max: 1000, unit_of_measurement: "ms" }
    end_text_flicker_speed:
      name: "End Text Flicker Speed (ms)"
      description: "Set the speed for the 'Random Flicker' effect. Lower is faster."
      default: 50
      selector:
        number: { min: 10, max: 1000, unit_of_measurement: "ms" }

    # ----------------------------------------------------------------
    # --- End Audio Configuration
    # ----------------------------------------------------------------
    audio_source:
      name: "End Audio Source"
      description: "Optional: Choose a sound to play when the countdown finishes. 'Built-in' sounds play from the device's SD card. 'Stream from HA' plays from your HA media library."
      default: "none"
      selector:
        select:
          mode: dropdown
          options:
            - { label: "None", value: "none" }
            - { label: "Built-in Sound Effect", value: "builtin" }
            - { label: "Stream from Home Assistant", value: "media" }
    sound_effect:
      name: "End Sound Effect"
      description: "Select a built-in sound effect to play from the device's SD card. This only applies if 'Built-in Sound Effect' is the selected audio source."
      default: "arrival_chime.mp3"
      selector:
        select:
          options:
            - { label: "Arrival Chime", value: "arrival_chime.mp3" }
            - { label: "System Beep", value: "sys_beep.mp3" }
            - { label: "Acceleration", value: "ACCELERATION.mp3" }
            - { label: "Electric Sparks", value: "electric_sparks.mp3" }
            - { label: "Engine Rev", value: "engine_rev.mp3" }
            - { label: "Flux Capacitor Power On", value: "flux_capacitor_power_on.mp3" }
            - { label: "Hum", value: "hum.mp3" }
            - { label: "Keypad Beeps", value: "keypad_beeps.mp3" }
            - { label: "Lock On", value: "lock_on.mp3" }
            - { label: "Relay Activation", value: "relay_activation.mp3" }
            - { label: "Time Travel", value: "time_travel.mp3" }
    media_file:
      name: "End Media File"
      description: "Select an audio file from your Home Assistant media library to stream. This only applies if 'Stream from Home Assistant' is the selected audio source."
      default: ""
      selector:
        media: {}
    audio_output_player:
      name: "[Advanced] Audio Output Override"
      description: "Optional: Select a different media player for audio output. If left blank, the audio will play on the Time Circuits device itself."
      default: ""
      selector:
        entity:
          domain: media_player
    volume:
      name: "End Audio Volume"
      description: "Set the volume for the sound effect or streamed media (0-100). The blueprint converts this to the device's native volume scale."
      default: 80
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }

    # ----------------------------------------------------------------
    # --- Loop and Cleanup
    # ----------------------------------------------------------------
    repeat_end_effect:
      name: "Repeat End Effect"
      description: "Number of times to repeat the end text and built-in sound. Note: Streamed audio from Home Assistant will NOT repeat."
      default: 1
      selector:
        number: { min: 1, max: 10, mode: box }
    restore_row:
      name: "Restore Row After"
      description: "If enabled, the display row will be restored to its previous state (e.g., the clock) after the sequence completes."
      default: true
      selector:
        boolean: {}

# ================================================================
# --- SCRIPT LOGIC (No need to edit below this line)
# ================================================================
mode: single

variables:
  device: !input device
  target_row: !input target_row
  start_number: !input start_number
  countdown_delay: !input countdown_delay
  end_text: !input end_text
  end_text_effect: !input end_text_effect
  end_text_duration: !input end_text_duration
  end_text_marquee_speed: !input end_text_marquee_speed
  end_text_flicker_speed: !input end_text_flicker_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  audio_output_player: !input audio_output_player
  volume: !input volume
  repeat_end_effect: !input repeat_end_effect
  restore_row: !input restore_row

sequence:
  # Condition: Ensure a device has been selected before proceeding.
  - condition: template
    value_template: "{{ device != none }}"

  # Action: Publish the generated sequencer command to the device via MQTT.
  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ ((device_attr(device, 'identifiers') | list | last)[1]) | trim }}/sequencer/command"
      payload: >-
        {#-
          JINJA2 TEMPLATE LOGIC
          This template constructs the JSON payload for the device's sequencer command.
          It builds a series of commands for the countdown, end text, and optional sound,
          then wraps them in a track structure targeting the selected display row(s).
          The final output is a JSON array of "track" objects.
        -#}
        {%- macro generate_countdown_payload(target, start_num, delay, end_txt, end_effect, end_dur, end_m_speed, end_f_speed, audio_src, sound, vol, repeat_count, restore) -%}
          {#- A namespace is used to hold the list of tracks as it's built. -#}
          {%- set ns = namespace(tracks=[]) -%}

          {#-
            Define which effects are self-blocking (run until complete) vs. timed (run for a set duration).
            This determines whether we need to add a `WAIT` command.
          -#}
          {%- set self_timing_effects = ['MARQUEE', 'RANDOM_FLICKER_TEXT'] -%}
          {%- set timed_effects = ['PULSE', 'FLASH', 'SCRAMBLE_TEXT'] -%}
          {%- set end_commands = [] -%}

          {# --- STEP 1: Build the end text command(s) --- #}
          {%- if end_txt | default('') != "" -%}
            {#- Create the base command with the selected effect and text. `targetSegment: -1` means "apply to the whole row". -#}
            {%- set end_text_cmd = {'command': end_effect, 'targetSegment': -1, 'stringParam': end_txt} -%}

            {#- Add effect-specific parameters based on the chosen effect. -#}
            {%- if end_effect == 'MARQUEE' -%}
              {%- set end_text_cmd = dict(end_text_cmd, intParam=end_m_speed | int) -%}
            {%- elif end_effect == 'RANDOM_FLICKER_TEXT' -%}
              {%- set end_text_cmd = dict(end_text_cmd, intParam=end_f_speed | int, intParam2=(end_dur * 1000) | int) -%}
            {%- elif end_effect == 'TYPEWRITER' -%}
              {#- For Typewriter, calculate the delay per character to match the total duration. Min delay of 20ms. -#}
              {%- set char_delay = ([((end_dur * 1000) / (end_txt | length)), 20] | max) | int -%}
              {%- set typewriter_cmd = dict(end_text_cmd, intParam=char_delay) -%}
              {%- set wait_cmd = {'command': 'WAIT', 'intParam': 1000} -%}
              {%- set end_commands = end_commands + [typewriter_cmd, wait_cmd] -%}
            {%- elif end_effect in timed_effects -%}
              {#- For timed effects, `intParam2` controls the total duration. -#}
              {%- set end_text_cmd = dict(end_text_cmd, intParam2=(end_dur * 1000) | int) -%}
            {%- endif -%}
            {%- set end_commands = end_commands + [end_text_cmd] -%}

            {#-
              For static or non-blocking effects, we must add a `WAIT` command to control
              how long the text stays on screen.
            -#}
            {%- if end_effect == 'RANDOM_FLICKER_TEXT' or (end_effect not in self_timing_effects and end_effect not in timed_effects) -%}
              {%- set end_commands = end_commands + [{'command': 'WAIT', 'intParam': (end_dur * 1000) | int}] -%}
            {%- endif -%}
          {%- endif -%}

          {# --- STEP 2: Create the main command list, starting with the countdown --- #}
          {#- The `COUNTDOWN` command is the core of this blueprint. `intParam` is the start number, `intParam2` is the delay. -#}
          {%- set final_commands = [{'command': 'COUNTDOWN', 'targetSegment': -1, 'intParam': start_num, 'intParam2': delay}] -%}

          {# --- STEP 3: Add the end text commands, wrapping in a loop if requested --- #}
          {%- if end_commands | length > 0 -%}
            {%- if (repeat_count | int) > 1 -%}
              {#- If repeating, wrap the end commands with `LOOP_START` and `LOOP_END`. -#}
              {%- set final_commands = final_commands + [{'command': 'LOOP_START', 'intParam': repeat_count | int}] + end_commands + [{'command': 'LOOP_END'}] -%}
            {%- else -%}
              {#- Otherwise, just append them. -#}
              {%- set final_commands = final_commands + end_commands -%}
            {%- endif -%}
          {%- endif -%}

          {# --- STEP 4: Add the restore command if requested --- #}
          {%- if restore -%}
            {#- `RESTORE_ROW` tells the device to revert the display to its previous state (e.g., the clock). -#}
            {%- set final_commands = final_commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}

          {# --- STEP 5: Generate the final track objects for each target row --- #}
          {#- If 'ALL' is selected, create a list of all three rows. Otherwise, use the single selected row. -#}
          {%- set track_list = ['TOP', 'MIDDLE', 'BOTTOM'] if target == 'ALL' else [target] -%}
          {%- for row in track_list -%}
            {%- set current_commands = final_commands -%}
            {#-
              Inject the built-in sound command. It plays *after* the countdown but *before* the end text.
              We only add it to the first track (if `target` is 'ALL') to prevent it from playing multiple times.
            -#}
            {%- if loop.first and audio_src == 'builtin' -%}
              {#- Convert HA's 0-100 volume to the device's 0-21 scale. -#}
              {%- set device_volume = ((vol / 100) * 21) | round(0) | int -%}
              {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
              {#- Insert the sound command right after the countdown command. -#}
              {%- set current_commands = [final_commands[0]] + [sound_command] + final_commands[1:] -%}
            {%- endif -%}
            {#- Create the final track object with the target row and the list of commands. -#}
            {%- set track_object = {'targetRow': row, 'commands': current_commands} -%}
            {%- set ns.tracks = ns.tracks + [track_object] -%}
          {%- endfor -%}

          {# --- STEP 6: Return the raw JSON array of tracks --- #}
          {#- The `to_json` filter converts the Python list of dictionaries into a valid JSON string. -#}
          {{- ns.tracks | to_json -}}
        {%- endmacro -%}
        {#- Call the macro with all the user inputs to generate the final payload. -#}
        {{- generate_countdown_payload(target_row, start_number, countdown_delay, end_text, end_text_effect, end_text_duration, end_text_marquee_speed, end_text_flicker_speed, audio_source, sound_effect, volume, repeat_end_effect, restore_row) -}}

  # Parallel Action: Handle streaming audio from Home Assistant.
  - choose:
      # This entire block runs in parallel with the MQTT `publish` service call above.
      - conditions:
          # Only run this sequence if the user selected 'media' and provided a media file.
          - "{{ audio_source == 'media' and media_file != '' }}"
        sequence:
          # Determine the target media_player. Use the override if provided, otherwise find the one from the device.
          - variables:
              target_player: >-
                {% if audio_output_player is defined and audio_output_player != '' %}
                  {{ audio_output_player }}
                {% else %}
                  {{ device_entities(device) | select('startswith', 'media_player.') | first | default('none') }}
                {% endif %}
          # Condition: Ensure we have a valid media_player to target.
          - condition: template
            value_template: "{{ target_player != 'none' }}"
          # Set the volume on the target media player before playing.
          - service: media_player.volume_set
            target:
              entity_id: "{{ target_player }}"
            data:
              volume_level: "{{ volume / 100 }}"
          # CRITICAL: Wait for the countdown part of the sequence to finish before playing the sound.
          # This delay must be calculated to match the duration of the countdown.
          - delay:
              seconds: "{{ (start_number * countdown_delay / 1000) | float(0) }}"
          # Play the selected media file from the HA media library.
          - service: media_player.play_media
            target:
              entity_id: "{{ target_player }}"
            data:
              media_content_id: !input media_file
              media_content_type: "music"