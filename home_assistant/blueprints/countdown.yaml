blueprint:
  name: "BTTF Time Circuits: Countdown Timer"
  description: >-
    A blueprint to run a countdown on the Time Circuits, with optional looping end text, sound, and advanced effects.
  domain: script
  input:
    device:
      name: Time Circuits Device
      description: The BTTF Time Circuits device to control.
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "The display row(s) to show the countdown on."
      default: "TOP"
      selector:
        select:
          options:
            - label: "Top Row (Destination Time)"
              value: "TOP"
            - label: "Middle Row (Present Time)"
              value: "MIDDLE"
            - label: "Bottom Row (Last Time Departed)"
              value: "BOTTOM"
            - label: "All Rows"
              value: "ALL"

    start_number:
      name: "Start Number"
      description: "The number to start counting down from."
      default: 10
      selector:
        number:
          min: 1
          max: 9999
    countdown_delay:
      name: "Countdown Delay (ms)"
      description: "The delay between each number change. 1000ms = 1 second."
      default: 1000
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: "ms"

    end_text:
      name: "End Text"
      description: "Optional text to display when the countdown finishes."
      default: "LIFTOFF"
      selector:
        text: {}
    end_text_effect:
      name: "End Text Visual Effect"
      description: "The visual effect to use for the end text."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text (Static)"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Pulse"
              value: "PULSE"
            - label: "Flash"
              value: "FLASH"
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Scramble Text"
              value: "SCRAMBLE_TEXT"
    end_text_duration:
      name: "End Text Display Duration (s)"
      description: "Duration for the non-blocking 'Set Text' end effect. Other effects like Pulse and Flash have their own internal timing."
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    end_text_marquee_speed:
      name: "End Text Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"

    audio_source:
      name: "End Audio Source"
      description: "Choose whether to play a sound when the countdown finishes."
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Built-in Sound Effect"
              value: "builtin"
            - label: "Stream from Home Assistant"
              value: "media"
    sound_effect:
      name: "End Sound Effect"
      description: "A built-in sound effect to play from the device."
      default: "arrival_chime.mp3"
      selector:
        select:
          options:
            - label: "Arrival Chime"
              value: "arrival_chime.mp3"
            - label: "System Beep"
              value: "sys_beep.mp3"
            - label: "Acceleration"
              value: "ACCELERATION.mp3"
            - label: "Electric Sparks"
              value: "electric_sparks.mp3"
            - label: "Engine Rev"
              value: "engine_rev.mp3"
            - label: "Flux Capacitor Power On"
              value: "flux_capacitor_power_on.mp3"
            - label: "Hum"
              value: "hum.mp3"
            - label: "Keypad Beeps"
              value: "keypad_beeps.mp3"
            - label: "Lock On"
              value: "lock_on.mp3"
            - label: "Relay Activation"
              value: "relay_activation.mp3"
            - label: "Time Travel"
              value: "time_travel.mp3"
    media_file:
      name: "End Media File"
      description: "Audio file to stream from the Home Assistant media library."
      default: ""
      selector:
        media:
          filter:
            media_class: music
    volume:
      name: "End Audio Volume"
      description: "Set the volume for the sound (0-100). Only used if an audio source is selected."
      default: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

    repeat_end_effect:
      name: "Repeat End Effect Count"
      description: "Number of times to repeat the end effect. Streamed audio will not repeat."
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state after all effects complete."
      default: true
      selector:
        boolean: {}

mode: single

variables:
  device_name: "{{ device_attr(device, 'name') | slugify }}"
  # Direct inputs
  target_row: !input target_row
  start_number: !input start_number
  countdown_delay: !input countdown_delay
  end_text: !input end_text
  end_text_effect: !input end_text_effect
  end_text_duration: !input end_text_duration
  end_text_marquee_speed: !input end_text_marquee_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  volume: !input volume
  repeat_end_effect: !input repeat_end_effect
  restore_row: !input restore_row
  # Templated variables
  final_end_text: "{{ end_text | default('') }}"
  final_media_file: "{{ media_file | default('') }}"

  payload: >
    {%- macro generate_countdown_payload(target, start_num, delay, end_txt, end_effect, end_duration, end_speed, audio_src, sound, vol, repeat_count, restore) -%}
      {%- set blocking_effects = ['PULSE', 'FLASH', 'MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT'] -%}
      {%- set end_commands = [] -%}
      {%- if end_txt != "" -%}
        {%- set end_text_cmd = {'command': end_effect, 'targetSegment': -1, 'stringParam': end_txt} -%}
        {%- if end_effect == 'MARQUEE' -%}
          {%- do end_text_cmd.update({'intParam': end_speed | int}) -%}
        {%- endif -%}
        {%- do end_commands.append(end_text_cmd) -%}
        {%- if end_effect not in blocking_effects -%}
          {%- do end_commands.append({'command': 'WAIT', 'intParam': (end_duration * 1000) | int}) -%}
        {%- endif -%}
      {%- endif -%}
      {%- set final_commands = [] -%}
      {%- do final_commands.append({'command': 'COUNTDOWN', 'targetSegment': -1, 'intParam': start_num, 'intParam2': delay}) -%}
      {%- if end_commands | length > 0 -%}
        {%- if (repeat_count | int) > 1 -%}
          {%- do final_commands.append({'command': 'LOOP_START', 'intParam': repeat_count | int}) -%}
          {%- do final_commands.extend(end_commands) -%}
          {%- do final_commands.append({'command': 'LOOP_END'}) -%}
        {%- else -%}
          {%- do final_commands.extend(end_commands) -%}
        {%- endif -%}
      {%- endif -%}
      {%- if restore -%}
        {%- do final_commands.append({'command': 'RESTORE_ROW'}) -%}
      {%- endif -%}
      {%- set tracks = [] -%}
      {%- if target == 'ALL' -%}
        {%- do tracks.append({'targetRow': 'TOP', 'commands': final_commands}) -%}
        {%- do tracks.append({'targetRow': 'MIDDLE', 'commands': final_commands}) -%}
        {%- do tracks.append({'targetRow': 'BOTTOM', 'commands': final_commands}) -%}
      {%- else -%}
        {%- do tracks.append({'targetRow': target, 'commands': final_commands}) -%}
      {%- endif -%}
      {%- if audio_src == 'builtin' -%}
        {%- set device_volume = ((vol / 100) * 21) | round(0) | int -%}
        {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
        {%- do tracks[0].commands.insert(0, sound_command) -%}
      {%- endif -%}
      {{- {'tracks': tracks} | to_json -}}
    {%- endmacro -%}
    {{- generate_countdown_payload(target_row, start_number, countdown_delay, final_end_text, end_text_effect, end_text_duration, end_text_marquee_speed, audio_source, sound_effect, volume, repeat_end_effect, restore_row) -}}

sequence:
  - service: logbook.log
    data:
      name: "{{ blueprint.name }}"
      message: "Running a {{ (start_number * countdown_delay / 1000) | round(1) }}s countdown on {{ device_name }}"
  - service: system_log.write
    data:
      level: info
      message: |
        Executing 'Countdown Timer' blueprint with the following parameters:
        Device: {{ device_name }} ({{ device }})
        Target Row: {{ target_row }}
        Start Number: {{ start_number }}
        Delay: {{ countdown_delay }}ms
        End Text: {{ final_end_text }}
        End Effect: {{ end_text_effect }}
        End Duration: {{ end_text_duration }}s
        End Marquee Speed: {{ end_text_marquee_speed }}ms
        End Audio Source: {{ audio_source }}
        End Sound: {{ sound_effect }}
        End Media File: {{ final_media_file }}
        Volume: {{ volume }}%
        Repeat End Effect: {{ repeat_end_effect }}
        Restore Row: {{ restore_row }}
        MQTT Payload: {{ payload }}
  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ device_name }}/cmnd/sequencer"
      payload: "{{ payload }}"
  - choose:
      - conditions:
          - "{{ audio_source == 'media' and final_media_file != '' }}"
        sequence:
          - service: media_player.volume_set
            target:
              device_id: !input device
            data:
              volume_level: "{{ volume / 100 }}"
          - delay:
              seconds: "{{ (start_number * countdown_delay / 1000) | float(0) }}"
          - service: media_player.play_media
            target:
              device_id: !input device
            data:
              media_content_id: "{{ final_media_file }}"
              media_content_type: "audio/mpeg"