blueprint:
  name: "BTTF Time Circuits: Countdown Timer"
  description: >-
    A blueprint to run a countdown on the Time Circuits, with optional looping end text, sound, and advanced effects.
  domain: script
  input:
    device:
      name: Time Circuits Device
      description: The BTTF Time Circuits device to control.
      selector:
        device:
          integration: bttf_time_circuits

    target_row:
      name: Target Row
      description: "The display row(s) to show the countdown on."
      default: "TOP"
      selector:
        select:
          options:
            - { label: "Top Row (Destination Time)", value: "TOP" }
            - { label: "Middle Row (Present Time)", value: "MIDDLE" }
            - { label: "Bottom Row (Last Time Departed)", value: "BOTTOM" }
            - { label: "All Rows", value: "ALL" }

    start_number:
      name: "Start Number"
      description: "The number to start counting down from."
      default: 10
      selector:
        number: { min: 1, max: 9999 }
    countdown_delay:
      name: "Countdown Delay (ms)"
      description: "The delay between each number change. 1000ms = 1 second."
      default: 1000
      selector:
        number: { min: 50, max: 5000, unit_of_measurement: "ms" }

    end_text:
      name: "End Text"
      description: "Optional text to display when the countdown finishes."
      default: "LIFTOFF"
      selector:
        text: {}
    end_text_effect:
      name: "End Text Visual Effect"
      description: "The visual effect to use for the end text."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse (2-second cycle)", value: "PULSE" }
            - { label: "Flash", value: "FLASH" }
            - { label: "Typewriter", value: "TYPEWRITER" }
            - { label: "Scramble Text", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker", value: "RANDOM_FLICKER_TEXT" }
    end_text_duration:
      name: "End Text Display Duration (s)"
      description: "Total duration for the 'Set Text', 'Pulse', 'Flash', 'Typewriter', and 'Scramble' end effects."
      default: 5
      selector:
        number: { min: 1, max: 60, unit_of_measurement: "s" }
    end_text_marquee_speed:
      name: "End Text Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number: { min: 20, max: 1000, unit_of_measurement: "ms" }

    audio_source:
      name: "End Audio Source"
      description: "Choose whether to play a sound when the countdown finishes."
      default: "none"
      selector:
        select:
          options:
            - { label: "None", value: "none" }
            - { label: "Built-in Sound Effect", value: "builtin" }
            - { label: "Stream from Home Assistant", value: "media" }
    sound_effect:
      name: "End Sound Effect"
      description: "A built-in sound effect to play from the device."
      default: "arrival_chime.mp3"
      selector:
        select:
          options:
            - { label: "Arrival Chime", value: "arrival_chime.mp3" }
            - { label: "System Beep", value: "sys_beep.mp3" }
            - { label: "Acceleration", value: "ACCELERATION.mp3" }
            - { label: "Electric Sparks", value: "electric_sparks.mp3" }
            - { label: "Engine Rev", value: "engine_rev.mp3" }
            - { label: "Flux Capacitor Power On", value: "flux_capacitor_power_on.mp3" }
            - { label: "Hum", value: "hum.mp3" }
            - { label: "Keypad Beeps", value: "keypad_beeps.mp3" }
            - { label: "Lock On", value: "lock_on.mp3" }
            - { label: "Relay Activation", value: "relay_activation.mp3" }
            - { label: "Time Travel", value: "time_travel.mp3" }
    media_file:
      name: "End Media File"
      description: "Audio file to stream from the Home Assistant media library."
      default: ""
      selector:
        media: {}
    volume:
      name: "End Audio Volume"
      description: "Set the volume for the sound (0-100). Only used if an audio source is selected."
      default: 80
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }

    repeat_end_effect:
      name: "Repeat End Effect Count"
      description: "Number of times to repeat the end effect. Streamed audio will not repeat."
      default: 1
      selector:
        number: { min: 1, max: 10, mode: box }
    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state after all effects complete."
      default: true
      selector:
        boolean: {}

mode: single

variables:
  device: !input device
  target_row: !input target_row
  start_number: !input start_number
  countdown_delay: !input countdown_delay
  end_text: !input end_text
  end_text_effect: !input end_text_effect
  end_text_duration: !input end_text_duration
  end_text_marquee_speed: !input end_text_marquee_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  volume: !input volume
  repeat_end_effect: !input repeat_end_effect
  restore_row: !input restore_row

sequence:
  - variables:
      device_id: "{{ (device_attr(device, 'identifiers') | list | last)[1] }}"
      final_end_text: "{{ end_text | default('') }}"
      final_media_file: "{{ media_file if audio_source == 'media' else '' }}"
      total_countdown_seconds: "{{ (start_number * countdown_delay / 1000) | float(0) }}"

  - condition: template
    value_template: "{{ device_id != none }}"

  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ device_id }}/sequencer/command"
      payload: >-
        {%- macro generate_countdown_payload(target, start_num, delay, end_txt, effect_val, end_duration, end_speed, audio_src, sound, vol, repeat_count, restore) -%}
          {%- set ns = namespace(final_commands=[], tracks=[]) -%}
          {%- set self_blocking_effects = ['PULSE', 'FLASH', 'MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT', 'RANDOM_FLICKER_TEXT'] -%}
          {%- set end_commands = [] -%}
          {%- set text_len = end_txt | length -%}
          {%- set duration_ms = (end_duration * 1000) | int -%}

          {%- set countdown_command = {'command': 'COUNTDOWN', 'targetSegment': -1, 'intParam': start_num, 'intParam2': delay} -%}
          {%- set ns.final_commands = [countdown_command] -%}

          {%- if audio_src == 'builtin' -%}
            {%- set device_volume = ((vol / 100) * 21) | round(0) | int -%}
            {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
            {%- set ns.final_commands = ns.final_commands + [sound_command] -%}
          {%- endif -%}

          {%- if end_txt != "" -%}
            {%- set base_command = {'command': effect_val, 'targetSegment': -1, 'stringParam': end_txt} -%}
            {%- if effect_val == 'MARQUEE' -%}
              {%- set visual_command = dict(base_command, intParam=end_speed | int) -%}
            {%- elif effect_val == 'PULSE' -%}
              {%- set visual_command = dict(base_command, intParam=1000, intParam2=duration_ms) -%}
            {%- elif effect_val == 'FLASH' -%}
              {%- set visual_command = dict(base_command, intParam2=duration_ms) -%}
            {%- elif effect_val == 'TYPEWRITER' and text_len > 0 -%}
              {%- set type_speed = (duration_ms / text_len) | int -%}
              {%- set visual_command = dict(base_command, intParam=type_speed) -%}
            {%- elif effect_val == 'SCRAMBLE_TEXT' and text_len > 0 -%}
              {%- set scramble_speed = (duration_ms / text_len) | int -%}
              {%- set visual_command = dict(base_command, intParam=50, intParam2=scramble_speed) -%}
            {%- elif effect_val == 'RANDOM_FLICKER_TEXT' -%}
              {%- set visual_command = dict(base_command, intParam=50, intParam2=duration_ms) -%}
            {%- else -%}
              {%- set visual_command = base_command -%}
            {%- endif -%}
            {%- set end_commands = end_commands + [visual_command] -%}

            {%- if effect_val not in self_blocking_effects -%}
              {%- set end_commands = end_commands + [{'command': 'WAIT', 'intParam': duration_ms}] -%}
            {%- endif -%}
          {%- endif -%}

          {%- if end_commands | length > 0 -%}
            {%- if (repeat_count | int) > 1 -%}
              {%- set ns.final_commands = ns.final_commands + [{'command': 'LOOP_START', 'intParam': repeat_count | int}] + end_commands + [{'command': 'LOOP_END'}] -%}
            {%- else -%}
              {%- set ns.final_commands = ns.final_commands + end_commands -%}
            {%- endif -%}
          {%- endif -%}

          {%- if restore -%}
            {%- set ns.final_commands = ns.final_commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}

          {%- if target == 'ALL' -%}
            {%- set track_list = ['TOP', 'MIDDLE', 'BOTTOM'] -%}
          {%- else -%}
            {%- set track_list = [target] -%}
          {%- endif -%}

          {%- for row in track_list -%}
            {%- set track_object = {'targetRow': row, 'commands': ns.final_commands} -%}
            {%- set ns.tracks = ns.tracks + [track_object] -%}
          {%- endfor -%}
          {{- ns.tracks | to_json -}}
        {%- endmacro -%}
        {{- generate_countdown_payload(target_row, start_number, countdown_delay, final_end_text, end_text_effect, end_text_duration, end_text_marquee_speed, audio_source, sound_effect, volume, repeat_end_effect, restore_row) -}}

  - choose:
      - conditions:
          - "{{ audio_source == 'media' and final_media_file != '' }}"
        sequence:
          - delay:
              seconds: "{{ total_countdown_seconds }}"
          - variables:
              media_player_entity: >
                {{ device_entities(device_id) | select('startswith', 'media_player.') | first | default('none') }}
          - condition: template
            value_template: "{{ media_player_entity != 'none' }}"
          - service: media_player.volume_set
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              volume_level: "{{ volume / 100 }}"
          - service: media_player.play_media
            target:
              entity_id: "{{ media_player_entity }}"
            data:
              media_content_id: "{{ final_media_file }}"
              media_content_type: "audio/mpeg"