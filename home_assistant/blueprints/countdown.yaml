blueprint:
  name: "BTTF Time Circuits: Countdown Timer"
  description: >-
    A blueprint to run a countdown on the Time Circuits, with optional looping end text, sound, and advanced effects.
  domain: script
  input:
    device:
      name: Time Circuits Device
      description: The BTTF Time Circuits device to control.
      selector:
        device:
          integration: bttf_time_circuits

    # --- Target ---
    target_row:
      name: Target Row
      description: "The display row(s) to show the countdown on."
      default: "TOP"
      selector:
        select:
          options:
            - label: "Top Row (Destination Time)"
              value: "TOP"
            - label: "Middle Row (Present Time)"
              value: "MIDDLE"
            - label: "Bottom Row (Last Time Departed)"
              value: "BOTTOM"
            - label: "All Rows"
              value: "ALL"

    # --- Countdown ---
    start_number:
      name: "Start Number"
      description: "The number to start counting down from."
      default: 10
      selector:
        number:
          min: 1
          max: 9999
    countdown_delay:
      name: "Countdown Delay (ms)"
      description: "The delay between each number change. 1000ms = 1 second."
      default: 1000
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: "ms"

    # --- End Text ---
    end_text:
      name: "End Text"
      description: "Optional text to display when the countdown finishes."
      default: "LIFTOFF"
      selector:
        text: {}
    end_text_effect:
      name: "End Text Visual Effect"
      description: "The visual effect to use for the end text."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text (Static)"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Pulse"
              value: "PULSE"
            - label: "Flash"
              value: "FLASH"
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Scramble Text"
              value: "SCRAMBLE_TEXT"
    end_text_duration:
      name: "End Text Display Duration (s)"
      description: "Duration for non-blocking effects like Set Text, Pulse, and Flash."
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    end_text_marquee_speed:
      name: "End Text Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"

    # --- End Audio ---
    audio_source:
      name: "End Audio Source"
      description: "Choose whether to play a sound when the countdown finishes."
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Built-in Sound Effect"
              value: "builtin"
            - label: "Stream from Home Assistant"
              value: "media"
    sound_effect:
      name: "End Sound Effect"
      description: "A built-in sound effect to play from the device."
      default: "arrival_chime.mp3"
      selector:
        select:
          options:
            - "ACCELERATION.mp3"
            - "arrival_chime.mp3"
            - "electric_sparks.mp3"
            - "engine_rev.mp3"
            - "flux_capacitor_power_on.mp3"
            - "hum.mp3"
            - "keypad_beeps.mp3"
            - "lock_on.mp3"
            - "relay_activation.mp3"
            - "sys_beep.mp3"
            - "time_travel.mp3"
    media_file:
      name: "End Media File"
      description: "Audio file to stream from the Home Assistant media library."
      default: ""
      selector:
        media:
          accept:
            - 'audio/*'
    volume:
      name: "End Audio Volume"
      description: "Set the volume for the sound (0-100). Only used if an audio source is selected."
      default: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

    # --- Behavior ---
    repeat_end_effect:
      name: "Repeat End Effect Count"
      description: "Number of times to repeat the end effect. Streamed audio will not repeat."
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state after all effects complete."
      default: true
      selector:
        boolean: {}

mode: single

variables:
  # Sanitize all templateable inputs to prevent 'LoggingUndefined' errors.
  # This ensures that even if a template fails, it provides a safe default
  # value instead of an 'Undefined' object that cannot be serialized to JSON.
  final_target_row: "{{ target_row | default('TOP') }}"
  final_start_number: "{{ start_number | default(10) }}"
  final_countdown_delay: "{{ countdown_delay | default(1000) }}"
  final_end_text: "{{ end_text | default('') }}"
  final_end_text_effect: "{{ end_text_effect | default('SET_TEXT') }}"
  final_end_text_duration: "{{ end_text_duration | default(5) }}"
  final_end_text_marquee_speed: "{{ end_text_marquee_speed | default(100) }}"
  final_audio_source: "{{ audio_source | default('none') }}"
  final_sound_effect: "{{ sound_effect | default('arrival_chime.mp3') }}"
  final_media_file: "{{ media_file | default('') }}"
  final_volume: "{{ volume | default(80) }}"
  final_repeat_end_effect: "{{ repeat_end_effect | default(1) }}"
  final_restore_row: "{{ restore_row | default(true) }}"

sequence:
  - variables:
      payload: >
        {%- macro generate_countdown_payload(target, start_num, delay, end_txt, end_effect, end_duration, end_speed, audio_src, sound, vol, repeat_count, restore) -%}
          {%- set blocking_effects = ['PULSE', 'FLASH', 'MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT'] -%}
          {%- set end_commands = [] -%}
          {%- if audio_src == 'builtin' and sound is not none -%}
            {%- set device_volume = (vol / 100 * 21) | round(0) | int -%}
            {%- set sound_command = {'command': 'SOUND', 'stringParam': sound, 'intParam': device_volume} -%}
            {%- set end_commands = end_commands + [sound_command] -%}
          {%- endif -%}
          {%- if end_txt != "" -%}
            {%- set end_text_cmd = {'command': end_effect, 'targetSegment': -1, 'stringParam': end_txt} -%}
            {%- if end_effect == 'MARQUEE' -%}
              {%- do end_text_cmd.update({'intParam': end_speed}) -%}
            {%- elif end_effect in ['PULSE', 'FLASH'] -%}
              {%- do end_text_cmd.update({'intParam': end_duration * 1000 | int}) -%}
            {%- endif -%}
            {%- set end_commands = end_commands + [end_text_cmd] -%}
            {%- if end_effect not in blocking_effects -%}
              {%- set end_commands = end_commands + [{'command': 'WAIT', 'intParam': end_duration * 1000 | int}] -%}
            {%- endif -%}
          {%- endif -%}
          {%- set final_commands = [] -%}
          {%- set final_commands = final_commands + [{'command': 'COUNTDOWN', 'targetSegment': -1, 'intParam': start_num, 'intParam2': delay}] -%}
          {%- if end_commands | length > 0 -%}
            {%- if repeat_count > 1 -%}
              {%- set final_commands = final_commands + [{'command': 'LOOP_START', 'intParam': repeat_count | int}] -%}
              {%- set final_commands = final_commands + end_commands -%}
              {%- set final_commands = final_commands + [{'command': 'LOOP_END'}] -%}
            {%- else -%}
              {%- set final_commands = final_commands + end_commands -%}
            {%- endif -%}
          {%- endif -%}
          {%- if restore -%}
            {%- set final_commands = final_commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}
          {%- if target == 'ALL' -%}
            {%- set tracks = [
              {'targetRow': 'TOP', 'commands': final_commands},
              {'targetRow': 'MIDDLE', 'commands': final_commands},
              {'targetRow': 'BOTTOM', 'commands': final_commands}
            ] -%}
          {%- else -%}
            {%- set tracks = [{'targetRow': target, 'commands': final_commands}] -%}
          {%- endif -%}
          {{- {'tracks': tracks} | to_json -}}
        {%- endmacro -%}
        {{- generate_countdown_payload(final_target_row, final_start_number, final_countdown_delay, final_end_text, final_end_text_effect, final_end_text_duration, final_end_text_marquee_speed, final_audio_source, final_sound_effect, final_volume, final_repeat_end_effect, final_restore_row) -}}
  - choose:
      # --- Case 1: Stream audio from Home Assistant ---
      # Set volume, run visuals, wait, then play media once.
      - conditions:
          - "{{ final_audio_source == 'media' and final_media_file != '' }}"
        sequence:
          - service: media_player.volume_set
            target:
              device_id: "{{ device_id(device) }}"
            data:
              volume_level: "{{ final_volume / 100 }}"
          - service: mqtt.publish
            data:
              topic: "bttf_time_circuits/{{ device_id(device) }}/cmnd/sequencer"
              payload: "{{ payload }}"
          - delay:
              seconds: "{{ (final_start_number * (final_countdown_delay / 1000)) | int(0) }}"
          - service: media_player.play_media
            target:
              device_id: "{{ device_id(device) }}"
            data:
              media_content_id: "{{ final_media_file }}"
              media_content_type: "audio/mpeg"

      # --- Case 2: Built-in sound or No sound ---
      # The MQTT payload already contains the (potentially looped) end effects.
    default:
      - service: mqtt.publish
        data:
          topic: "bttf_time_circuits/{{ device_id(device) }}/cmnd/sequencer"
          payload: "{{ payload }}"