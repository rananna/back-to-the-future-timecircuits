blueprint:
  name: BTTF Time Circuits - Scramble Text Sequence
  description: >-
    Creates a script to run a 'scramble' animation, where random characters flicker before locking in to the final text.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to show the animation on.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    text_to_display:
      name: Text to Reveal
      description: "The final text to be revealed (max 13 characters). Supports Home Assistant templates."
      selector:
        text:
    lock_in_speed:
      name: Lock-in Speed (milliseconds)
      description: "The delay between each character being revealed, in milliseconds. A lower number is faster."
      default: 75
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    scramble_speed:
      name: Scramble Speed (milliseconds)
      description: "The speed of the random character flicker, in milliseconds. A lower number is faster."
      default: 50
      selector:
        number:
          min: 20
          max: 500
          unit_of_measurement: "ms"
    restore_row:
      name: Restore Row After Scramble
      description: "If enabled, the row will be restored to its previous state after the animation finishes."
      default: true
      selector:
        boolean: {}

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- set steps = [
          {
            "command": "SCRAMBLE_TEXT",
            "targetRow": target_row,
            "targetSegment": -1,
            "stringParam": text_to_display,
            "intParam": lock_in_speed,
            "intParam2": scramble_speed
          }
        ] -%}
        {%- if restore_row -%}
          {# Wait for the scramble animation to complete before restoring the row #}
          {%- set wait_duration = (text_to_display | length) * lock_in_speed -%}
          {%- set steps = steps + [
            {"command": "WAIT", "intParam": wait_duration | int},
            {"command": "RESTORE_ROW", "targetRow": target_row}
          ] -%}
        {%- endif -%}
        {{ {"tracks": [steps]} | to_json }}