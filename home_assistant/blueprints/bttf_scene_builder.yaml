blueprint:
  name: BTTF Time Circuits - Scene Builder
  description: >-
    A user-friendly blueprint for creating complex, multi-track animations.
    Configure each of the three display rows independently using simple forms.
    This is the recommended way to build custom scenes with parallel effects.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"

    # =================================================================================
    # == TOP ROW (DESTINATION TIME)
    # =================================================================================
    enable_top_row:
      name: "[Top Row] Enable Track"
      description: "Enable this track to include it in the animation sequence."
      default: false
      selector:
        boolean: {}
    top_effect:
      name: "[Top Row] Effect Type"
      description: "Select the type of effect to generate for the top row."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text / Display Sensor"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Scramble Text"
              value: "SCRAMBLE_TEXT"
            - label: "Countdown"
              value: "COUNTDOWN"
            - label: "Pulse Row"
              value: "PULSE"
            - label: "Flash Row"
              value: "FLASH"
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Crossfade Text"
              value: "CROSSFADE_TEXT"
            - label: "Scanner"
              value: "SCANNER"
            - label: "Bar Graph"
              value: "BAR_GRAPH"
    top_text_to_display:
      name: "[Top Row] Text to Display"
      description: "Text for the effect (supports templates). This is overridden if you select an Entity below."
      default: ""
    top_entity_to_display:
      name: "[Top Row] Entity to Display (Optional)"
      description: "If selected, the entity's state will be used as the text for the chosen effect."
      selector:
        entity: {}
    top_prefix:
      name: "[Top Row] Entity Prefix"
      description: "Optional text to display before the entity's value (e.g., 'Temp: ')."
      default: ""
    top_postfix:
      name: "[Top Row] Entity Postfix"
      description: "Optional text to display after the entity's value (e.g., '°C')."
      default: ""
    top_speed:
      name: "[Top Row] [Marquee/Scramble/Typewriter] Speed/Delay (ms)"
      description: "Marquee/Scramble: Flicker speed. Typewriter: Delay between characters. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    top_reveal_delay:
      name: "[Top Row] [Scramble] Reveal Delay (ms)"
      description: "Delay between each character locking in. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    top_crossfade_duration:
      name: "[Top Row] Crossfade Duration (ms)"
      description: "Duration of the fade in/out effect."
      default: 1000
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: "ms"
    top_start_number:
      name: "[Top Row] Countdown Start Number"
      default: 10
      selector:
        number:
          min: 1
          max: 9999
    top_countdown_delay:
      name: "[Top Row] Countdown Delay (ms)"
      default: 1000
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: "ms"
    top_end_text:
      name: "[Top Row] Countdown End Text"
      description: "Optional text to display when the countdown finishes."
      default: ""
    top_bargraph_percentage:
      name: "[Top Row] Bar Graph Percentage"
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    top_bargraph_duration:
      name: "[Top Row] Bar Graph Duration (ms)"
      default: 2000
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: "ms"
    top_duration:
      name: "[Top Row] Display Duration (s)"
      description: "Duration for Set Text, Pulse, Flash, Scanner, and Countdown End Text."
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    top_restore_row:
      name: "[Top Row] Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state."
      default: true
      selector:
        boolean: {}

    # =================================================================================
    # == MIDDLE ROW (PRESENT TIME)
    # =================================================================================
    enable_middle_row:
      name: "[Middle Row] Enable Track"
      description: "Enable this track to include it in the animation sequence."
      default: false
      selector:
        boolean: {}
    middle_effect:
      name: "[Middle Row] Effect Type"
      description: "Select the type of effect to generate for the middle row."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text / Display Sensor"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Scramble Text"
              value: "SCRAMBLE_TEXT"
            - label: "Countdown"
              value: "COUNTDOWN"
            - label: "Pulse Row"
              value: "PULSE"
            - label: "Flash Row"
              value: "FLASH"
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Crossfade Text"
              value: "CROSSFADE_TEXT"
            - label: "Scanner"
              value: "SCANNER"
            - label: "Bar Graph"
              value: "BAR_GRAPH"
    middle_text_to_display:
      name: "[Middle Row] Text to Display"
      description: "Text for the effect (supports templates). This is overridden if you select an Entity below."
      default: ""
    middle_entity_to_display:
      name: "[Middle Row] Entity to Display (Optional)"
      description: "If selected, the entity's state will be used as the text for the chosen effect."
      selector:
        entity: {}
    middle_prefix:
      name: "[Middle Row] Entity Prefix"
      description: "Optional text to display before the entity's value (e.g., 'Temp: ')."
      default: ""
    middle_postfix:
      name: "[Middle Row] Entity Postfix"
      description: "Optional text to display after the entity's value (e.g., '°C')."
      default: ""
    middle_speed:
      name: "[Middle Row] [Marquee/Scramble/Typewriter] Speed/Delay (ms)"
      description: "Marquee/Scramble: Flicker speed. Typewriter: Delay between characters. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    middle_reveal_delay:
      name: "[Middle Row] [Scramble] Reveal Delay (ms)"
      description: "Delay between each character locking in. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    middle_crossfade_duration:
      name: "[Middle Row] [Crossfade] Duration (ms)"
      description: "The duration of the fade in/out effect."
      default: 1000
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: "ms"
    middle_start_number:
      name: "[Middle Row] [Countdown] Start Number"
      description: "The number to start counting down from."
      default: 10
      selector:
        number:
          min: 1
          max: 9999
    middle_countdown_delay:
      name: "[Middle Row] [Countdown] Countdown Delay (ms)"
      description: "The delay between each number change. 1000ms = 1 second."
      default: 1000
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: "ms"
    middle_end_text:
      name: "[Middle Row] [Countdown] End Text"
      description: "Optional text to display when the countdown finishes."
      default: ""
    middle_bargraph_percentage:
      name: "[Middle Row] [Bar Graph] Starting Percentage"
      description: "The percentage (0-100) at which the bar graph should start."
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    middle_bargraph_duration:
      name: "[Middle Row] [Bar Graph] Animation Duration (ms)"
      description: "The total time for the bar graph animation to complete."
      default: 2000
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: "ms"
    middle_duration:
      name: "[Middle Row] Display Duration (s)"
      description: "How long the effect should be visible. Used by Set Text, Pulse, Flash, Scanner, and Countdown End Text."
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    middle_restore_row:
      name: "[Middle Row] Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state."
      default: true
      selector:
        boolean: {}

    # =================================================================================
    # == BOTTOM ROW (LAST TIME DEPARTED)
    # =================================================================================
    enable_bottom_row:
      name: "[Bottom Row] Enable Track"
      description: "Enable this track to include it in the animation sequence."
      default: false
      selector:
        boolean: {}
    bottom_effect:
      name: "[Bottom Row] Effect Type"
      description: "Select the type of effect to generate for the bottom row."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text / Display Sensor"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Scramble Text"
              value: "SCRAMBLE_TEXT"
            - label: "Countdown"
              value: "COUNTDOWN"
            - label: "Pulse Row"
              value: "PULSE"
            - label: "Flash Row"
              value: "FLASH"
            - label: "Typewriter"
              value: "TYPEWRITER"
            - label: "Crossfade Text"
              value: "CROSSFADE_TEXT"
            - label: "Scanner"
              value: "SCANNER"
            - label: "Bar Graph"
              value: "BAR_GRAPH"
    bottom_text_to_display:
      name: "[Bottom Row] Text to Display"
      description: "Text for the effect (supports templates). This is overridden if you select an Entity below."
      default: ""
    bottom_entity_to_display:
      name: "[Bottom Row] Entity to Display (Optional)"
      description: "If selected, the entity's state will be used as the text for the chosen effect."
      selector:
        entity: {}
    bottom_prefix:
      name: "[Bottom Row] Entity Prefix"
      description: "Optional text to display before the entity's value (e.g., 'Temp: ')."
      default: ""
    bottom_postfix:
      name: "[Bottom Row] Entity Postfix"
      description: "Optional text to display after the entity's value (e.g., '°C')."
      default: ""
    bottom_speed:
      name: "[Bottom Row] [Marquee/Scramble/Typewriter] Speed/Delay (ms)"
      description: "Marquee/Scramble: Flicker speed. Typewriter: Delay between characters. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    bottom_reveal_delay:
      name: "[Bottom Row] [Scramble] Reveal Delay (ms)"
      description: "Delay between each character locking in. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    bottom_crossfade_duration:
      name: "[Bottom Row] [Crossfade] Duration (ms)"
      description: "The duration of the fade in/out effect."
      default: 1000
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: "ms"
    bottom_start_number:
      name: "[Bottom Row] [Countdown] Start Number"
      description: "The number to start counting down from."
      default: 10
      selector:
        number:
          min: 1
          max: 9999
    bottom_countdown_delay:
      name: "[Bottom Row] [Countdown] Countdown Delay (ms)"
      description: "The delay between each number change. 1000ms = 1 second."
      default: 1000
      selector:
        number:
          min: 50
          max: 5000
          unit_of_measurement: "ms"
    bottom_end_text:
      name: "[Bottom Row] [Countdown] End Text"
      description: "Optional text to display when the countdown finishes."
      default: ""
    bottom_bargraph_percentage:
      name: "[Bottom Row] [Bar Graph] Starting Percentage"
      description: "The percentage (0-100) at which the bar graph should start."
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    bottom_bargraph_duration:
      name: "[Bottom Row] [Bar Graph] Animation Duration (ms)"
      description: "The total time for the bar graph animation to complete."
      default: 2000
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: "ms"
    bottom_duration:
      name: "[Bottom Row] Display Duration (s)"
      description: "How long the effect should be visible. Used by Set Text, Pulse, Flash, Scanner, and Countdown End Text."
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    bottom_restore_row:
      name: "[Bottom Row] Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state."
      default: true
      selector:
        boolean: {}

mode: single

sequence:
  - service: mqtt.publish
    data_template:
      topic: !input mqtt_topic
      payload: >
        {%- macro build_commands(effect, restore_row, text_to_display, entity_to_display, prefix, postfix, speed, reveal_delay, crossfade_duration, start_number, countdown_delay, end_text, bargraph_percentage, bargraph_duration, duration) -%}
          {#- Step 1: Determine the final text. Use the entity state if provided, otherwise use the text input. -#}
          {%- set ns = namespace(final_text=text_to_display) -%}
          {%- if entity_to_display and states(entity_to_display) -%}
            {%- set ns.final_text = prefix ~ states(entity_to_display) ~ postfix -%}
          {%- endif -%}

          {#- Step 2: Build the primary command. It does NOT include targetRow. -#}
          {%- set command = {'command': effect, 'targetSegment': -1} -%}

          {#- Add text parameter if used by the effect. -#}
          {%- if effect in ['SET_TEXT', 'MARQUEE', 'SCRAMBLE_TEXT', 'TYPEWRITER', 'CROSSFADE_TEXT', 'BAR_GRAPH'] -%}
            {%- do command.update({'stringParam': ns.final_text}) -%}
          {%- endif -%}

          {#- Add effect-specific numeric/timing parameters -#}
          {%- if effect == 'MARQUEE' or effect == 'TYPEWRITER' -%}
            {%- do command.update({'intParam': speed}) -%}
          {%- elif effect == 'SCRAMBLE_TEXT' -%}
            {%- do command.update({'intParam': speed, 'intParam2': reveal_delay}) -%}
          {%- elif effect == 'COUNTDOWN' -%}
            {%- do command.update({'intParam': start_number, 'intParam2': countdown_delay}) -%}
          {%- elif effect == 'PULSE' or effect == 'FLASH' -%}
            {%- do command.update({'intParam': duration * 1000}) -%}
          {%- elif effect == 'CROSSFADE_TEXT' -%}
            {%- do command.update({'intParam': crossfade_duration}) -%}
          {%- elif effect == 'BAR_GRAPH' -%}
            {%- do command.update({'intParam': bargraph_percentage, 'intParam2': bargraph_duration}) -%}
          {%- endif -%}

          {%- set commands = [command] -%}

          {#- Step 3: Add subsequent commands like WAIT and RESTORE_ROW if needed -#}
          {%- if restore_row -%}
            {%- set wait = namespace(duration=0) -%}

            {#- A. Blocking commands with a built-in duration (PULSE, FLASH) don't need a separate WAIT step. -#}

            {#- B. Commands that need a calculated WAIT duration. -#}
            {%- if effect == 'MARQUEE' -%}
              {%- set wait.duration = speed * (ns.final_text | length + 26) -%}
            {%- elif effect == 'SCRAMBLE_TEXT' -%}
              {%- set wait.duration = (reveal_delay * (ns.final_text | length + 1)) -%}
            {%- elif effect == 'TYPEWRITER' -%}
              {%- set wait.duration = (speed * (ns.final_text | length)) + 1000 -%}
            {%- elif effect == 'CROSSFADE_TEXT' -%}
              {%- set wait.duration = crossfade_duration * 2 -%}
            {%- elif effect == 'BAR_GRAPH' -%}
              {%- set wait.duration = bargraph_duration -%}

            {#- C. Commands with special multi-step logic (like displaying text after a countdown). -#}
            {%- elif effect == 'COUNTDOWN' -%}
              {#- The COUNTDOWN command is blocking, so no WAIT is needed for the countdown itself. -#}
              {#- If there is end text, add a command to display it, then wait for the user-defined duration. -#}
              {%- if end_text != "" -%}
                {%- set commands = commands + [{"command": "SET_TEXT", "targetSegment": -1, "stringParam": end_text}] -%}
                {%- set wait.duration = duration * 1000 -%}
              {%- endif -%}

            {#- D. Commands that use the simple manual duration input. -#}
            {%- elif effect in ['SET_TEXT', 'SCANNER'] -%}
              {%- set wait.duration = duration * 1000 -%}
            {%- endif -%}

            {#- Add the main WAIT step if a duration was calculated or set above. -#}
            {%- if wait.duration > 0 -%}
              {%- set commands = commands + [{"command": "WAIT", "intParam": wait.duration | int }] -%}
            {%- endif -%}

            {#- Add the final restore command. It does not need a targetRow. -#}
            {%- set commands = commands + [{"command": "RESTORE_ROW"}] -%}
          {%- endif -%}
          {{- commands -}}
        {%- endmacro -%}

        {%- set all_tracks = [] -%}

        {%- if enable_top_row -%}
          {%- set top_commands = build_commands(top_effect, top_restore_row, top_text_to_display, top_entity_to_display, top_prefix, top_postfix, top_speed, top_reveal_delay, top_crossfade_duration, top_start_number, top_countdown_delay, top_end_text, top_bargraph_percentage, top_bargraph_duration, top_duration) | from_yaml -%}
          {%- if top_commands -%}{%- do all_tracks.append({"targetRow": "TOP", "commands": top_commands}) -%}{%- endif -%}
        {%- endif -%}

        {%- if enable_middle_row -%}
          {%- set middle_commands = build_commands(middle_effect, middle_restore_row, middle_text_to_display, middle_entity_to_display, middle_prefix, middle_postfix, middle_speed, middle_reveal_delay, middle_crossfade_duration, middle_start_number, middle_countdown_delay, middle_end_text, middle_bargraph_percentage, middle_bargraph_duration, middle_duration) | from_yaml -%}
          {%- if middle_commands -%}{%- do all_tracks.append({"targetRow": "MIDDLE", "commands": middle_commands}) -%}{%- endif -%}
        {%- endif -%}

        {%- if enable_bottom_row -%}
          {%- set bottom_commands = build_commands(bottom_effect, bottom_restore_row, bottom_text_to_display, bottom_entity_to_display, bottom_prefix, bottom_postfix, bottom_speed, bottom_reveal_delay, bottom_crossfade_duration, bottom_start_number, bottom_countdown_delay, bottom_end_text, bottom_bargraph_percentage, bottom_bargraph_duration, bottom_duration) | from_yaml -%}
          {%- if bottom_commands -%}{%- do all_tracks.append({"targetRow": "BOTTOM", "commands": bottom_commands}) -%}{%- endif -%}
        {%- endif -%}

        {{ {'tracks': all_tracks} | to_json }}