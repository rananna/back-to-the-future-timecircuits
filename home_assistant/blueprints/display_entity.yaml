blueprint:
  name: "BTTF Time Circuits: Display Entity"
  description: >-
    A simple blueprint for displaying the state of a Home Assistant entity on one of the Time Circuits rows.
  domain: script
  input:
    base_topic:
      name: MQTT Base Topic
      description: The base topic for your Time Circuits MQTT integration.
      default: "bttf-time-circuits"
    device_id:
      name: Device ID
      description: The unique device ID for your Time Circuits clock.
    target_row:
      name: Target Row
      description: "The display row to show the entity state on."
      default: "TOP"
      selector:
        select:
          options:
            - label: "Top Row (Destination Time)"
              value: "TOP"
            - label: "Middle Row (Present Time)"
              value: "MIDDLE"
            - label: "Bottom Row (Last Time Departed)"
              value: "BOTTOM"
    entity_to_display:
      name: "Entity to Display"
      description: "The entity whose state you want to display."
      selector:
        entity: {}
    prefix:
      name: "Prefix"
      description: "Optional text to display before the entity's value (e.g., 'Temp: ')."
      default: ""
    postfix:
      name: "Postfix"
      description: "Optional text to display after the entity's value (e.g., '°C')."
      default: ""
    effect:
      name: "Effect Type"
      description: "The visual effect to use for the message."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - label: "Set Text (Static)"
              value: "SET_TEXT"
            - label: "Marquee (Scrolling Text)"
              value: "MARQUEE"
            - label: "Pulse"
              value: "PULSE"
            - label: "Flash"
              value: "FLASH"
    duration:
      name: "Display Duration (s)"
      description: "Duration for Set Text, Pulse, and Flash effects."
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "s"
    marquee_speed:
      name: "Marquee Speed (ms)"
      description: "The scroll speed for the marquee effect. Lower is faster."
      default: 100
      selector:
        number:
          min: 20
          max: 1000
          unit_of_measurement: "ms"
    restore_row:
      name: "Restore Row After Effect"
      description: "If enabled, the row will be restored to its previous state."
      default: true
      selector:
        boolean: {}

mode: single

sequence:
  - service: mqtt.publish
    data:
      topic: "{{ base_topic }}/{{ device_id }}/cmnd/sequencer"
      payload: >
        {%- macro generate_sequence_payload(effect, text_to_display, duration, marquee_speed, restore_row) -%}
          {%- set command = {'command': effect, 'targetSegment': -1, 'stringParam': text_to_display} -%}
          {%- set commands = [] -%}

          {# Set parameters based on effect type #}
          {%- if effect == 'MARQUEE' -%}
            {%- do command.update({'intParam': marquee_speed}) -%}
          {%- elif effect in ['PULSE', 'FLASH'] -%}
            {%- do command.update({'intParam': duration * 1000}) -%}
          {%- endif -%}

          {# Add the main command #}
          {%- set commands = commands + [command] -%}

          {# Non-blocking SET_TEXT effect requires a WAIT command to be visible for the specified duration #}
          {%- if effect == 'SET_TEXT' -%}
            {%- set commands = commands + [{'command': 'WAIT', 'intParam': duration * 1000 | int}] -%}
          {%- endif -%}

          {# Handle row restoration #}
          {%- if restore_row -%}
            {# Add the final command to restore the row to its previous state #}
            {%- set commands = commands + [{'command': 'RESTORE_ROW'}] -%}
          {%- endif -%}

          {{- {'tracks': [{'targetRow': target_row, 'commands': commands}]} | to_json -}}
        {%- endmacro -%}

        {%- set text_to_display = prefix ~ states(entity_to_display) ~ postfix -%}
        {{- generate_sequence_payload(effect, text_to_display, duration, marquee_speed, restore_row) -}}