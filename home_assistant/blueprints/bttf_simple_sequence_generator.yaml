blueprint:
  name: BTTF Time Circuits - Simple Text Sequence
  description: >-
    Creates a script to run a simple animation sequence on the BTTF Time Circuits display.
    This blueprint generates a JSON payload to set text on a display row for a specific duration,
    then restores the row.
  domain: script
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to publish the sequencer command to.
      default: "bttf-time-circuits/cmnd/sequencer"
    target_row:
      name: Target Row
      description: The display row to show the text on.
      selector:
        select:
          options:
            - label: "Top (Destination Time)"
              value: "TOP"
            - label: "Middle (Present Time)"
              value: "MIDDLE"
            - label: "Bottom (Last Time Departed)"
              value: "BOTTOM"
    text_to_display:
      name: Text to Display
      description: "The text to show on the selected row (max 13 characters). Supports Home Assistant templates."
      selector:
        text:
    duration:
      name: Display Duration (seconds)
      description: How long the text should remain on the screen before the row is restored.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: "s"

mode: single

sequence:
  - service: mqtt.publish
    data:
      topic: !input mqtt_topic
      payload: >
        {%- set payload_dict = {
          "tracks": [
            [
              {
                "command": "SET_TEXT",
                "targetRow": target_row,
                "targetSegment": -1,
                "stringParam": text_to_display
              },
              {
                "command": "WAIT",
                "intParam": (duration * 1000) | int
              },
              {
                "command": "RESTORE_ROW",
                "targetRow": target_row
              }
            ]
          ]
        } -%}
        {{ payload_dict | to_json }}