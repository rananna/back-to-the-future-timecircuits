blueprint:
  name: "BTTF Time Circuits: Multi-Row Status Board"
  description: >-
    **Display different information on all three rows of the Time Circuits simultaneously.**

    This advanced blueprint lets you create a custom status board. Each row can be configured independently
    with its own text and visual effect. You can also add a single sound that plays at the start of the sequence.
    This is ideal for showing a summary of information, like weather, time, and notifications, all at once.
  domain: script
  input:
    # ----------------------------------------------------------------
    # --- Device and Target Inputs
    # ----------------------------------------------------------------
    device:
      name: Time Circuits Device
      description: "Select the BTTF Time Circuits device you want to control. This is the most important input!"
      selector:
        device:
          integration: bttf_time_circuits

    # ----------------------------------------------------------------
    # --- Top Row Configuration
    # ----------------------------------------------------------------
    top_row_text:
      name: "[TOP ROW] Text"
      description: "Text to display on the top row. Supports Home Assistant templates. Leave this blank to ignore this row."
      default: ""
      selector:
        text: {}
    top_row_effect:
      name: "[TOP ROW] Visual Effect"
      description: "Choose the visual effect for the top row."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse (2-second on/off cycle)", value: "PULSE" }
            - { label: "Flash (Fast blinking)", value: "FLASH" }
            - { label: "Typewriter (Reveals text character by character)", value: "TYPEWRITER" }
            - { label: "Scramble Text (Reveals text from a scramble)", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker (Flickers characters randomly)", value: "RANDOM_FLICKER_TEXT" }

    # ----------------------------------------------------------------
    # --- Middle Row Configuration
    # ----------------------------------------------------------------
    middle_row_text:
      name: "[MIDDLE ROW] Text"
      description: "Text to display on the middle row. Supports Home Assistant templates. Leave this blank to ignore this row."
      default: ""
      selector:
        text: {}
    middle_row_effect:
      name: "[MIDDLE ROW] Visual Effect"
      description: "Choose the visual effect for the middle row."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse (2-second on/off cycle)", value: "PULSE" }
            - { label: "Flash (Fast blinking)", value: "FLASH" }
            - { label: "Typewriter (Reveals text character by character)", value: "TYPEWRITER" }
            - { label: "Scramble Text (Reveals text from a scramble)", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker (Flickers characters randomly)", value: "RANDOM_FLICKER_TEXT" }

    # ----------------------------------------------------------------
    # --- Bottom Row Configuration
    # ----------------------------------------------------------------
    bottom_row_text:
      name: "[BOTTOM ROW] Text"
      description: "Text to display on the bottom row. Supports Home Assistant templates. Leave this blank to ignore this row."
      default: ""
      selector:
        text: {}
    bottom_row_effect:
      name: "[BOTTOM ROW] Visual Effect"
      description: "Choose the visual effect for the bottom row."
      default: "SET_TEXT"
      selector:
        select:
          options:
            - { label: "Set Text (Static)", value: "SET_TEXT" }
            - { label: "Marquee (Scrolling Text)", value: "MARQUEE" }
            - { label: "Pulse (2-second on/off cycle)", value: "PULSE" }
            - { label: "Flash (Fast blinking)", value: "FLASH" }
            - { label: "Typewriter (Reveals text character by character)", value: "TYPEWRITER" }
            - { label: "Scramble Text (Reveals text from a scramble)", value: "SCRAMBLE_TEXT" }
            - { label: "Random Flicker (Flickers characters randomly)", value: "RANDOM_FLICKER_TEXT" }

    # ----------------------------------------------------------------
    # --- Shared Effect Timing & Behavior
    # ----------------------------------------------------------------
    duration:
      name: "Display Duration (s)"
      description: "Shared duration for 'Set Text', 'Pulse', and 'Flash' effects across all active rows. This ensures timed effects stay in sync."
      default: 10
      selector:
        number: { min: 1, max: 300, unit_of_measurement: "s" }
    marquee_speed:
      name: "Marquee Speed (ms)"
      description: "Shared scroll speed for the marquee effect on any row. Lower is faster."
      default: 100
      selector:
        number: { min: 20, max: 1000, unit_of_measurement: "ms" }
    flicker_speed:
      name: "Flicker Speed (ms)"
      description: "Shared speed for the 'Random Flicker' effect on any row. Lower is faster."
      default: 50
      selector:
        number: { min: 10, max: 1000, unit_of_measurement: "ms" }
    restore_rows:
      name: "Restore All Rows After"
      description: "If enabled, all active rows will be restored to their previous state (e.g., the clock) after the sequence completes."
      default: true
      selector:
        boolean: {}

    # ----------------------------------------------------------------
    # --- Shared Audio Configuration
    # ----------------------------------------------------------------
    audio_source:
      name: "Audio Source"
      description: "Optional: Choose a sound to play with the visual effect. Plays once at the start of the entire sequence."
      default: "none"
      selector:
        select:
          mode: dropdown
          options:
            - { label: "None", value: "none" }
            - { label: "Built-in Sound Effect", value: "builtin" }
            - { label: "Stream from Home Assistant", value: "media" }
    sound_effect:
      name: "Sound Effect"
      description: "Select a built-in sound effect to play from the device's SD card. This only applies if 'Built-in Sound Effect' is the selected audio source."
      default: "sys_beep.mp3"
      selector:
        select:
          options:
            - { label: "System Beep", value: "sys_beep.mp3" }
            - { label: "Arrival Chime", value: "arrival_chime.mp3" }
            - { label: "Electric Sparks", value: "electric_sparks.mp3" }
            - { label: "Engine Rev", value: "engine_rev.mp3" }
            - { label: "Flux Capacitor Power On", value: "flux_capacitor_power_on.mp3" }
            - { label: "Hum", value: "hum.mp3" }
            - { label: "Keypad Beeps", value: "keypad_beeps.mp3" }
            - { label: "Lock On", value: "lock_on.mp3" }
            - { label: "Relay Activation", value: "relay_activation.mp3" }
            - { label: "Time Travel", value: "time_travel.mp3" }
    media_file:
      name: "Media File"
      description: "Select an audio file from your Home Assistant media library to stream. This only applies if 'Stream from Home Assistant' is the selected audio source."
      default: ""
      selector:
        media: {}
    audio_output_player:
      name: "[Advanced] Audio Output Override"
      description: "Optional: Select a different media player for audio output. If left blank, the audio will play on the Time Circuits device itself."
      default: ""
      selector:
        entity:
          domain: media_player
    volume:
      name: Volume
      description: "Set the volume for the sound effect or streamed media (0-100). The blueprint converts this to the device's native volume scale."
      default: 80
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }

# ================================================================
# --- SCRIPT LOGIC (No need to edit below this line)
# ================================================================
mode: single

variables:
  # --- Collect all user inputs into variables for easier use ---
  device: !input device
  duration: !input duration
  marquee_speed: !input marquee_speed
  flicker_speed: !input flicker_speed
  audio_source: !input audio_source
  sound_effect: !input sound_effect
  media_file: !input media_file
  audio_output_player: !input audio_output_player
  volume: !input volume
  restore_rows: !input restore_rows

  # --- Data Structure for Rows ---
  # This creates a list of "row" objects. Each object contains the configuration
  # for a single display row. This structure makes it easy to loop through and
  # generate the multi-track payload later.
  rows_data:
    - target: "TOP"
      text: !input top_row_text
      effect: !input top_row_effect
    - target: "MIDDLE"
      text: !input middle_row_text
      effect: !input middle_row_effect
    - target: "BOTTOM"
      text: !input bottom_row_text
      effect: !input bottom_row_effect

sequence:
  # Condition: Ensure a device has been selected before proceeding.
  - condition: template
    value_template: "{{ device != none }}"

  # Action: Publish the generated sequencer command to the device via MQTT.
  - service: mqtt.publish
    data:
      topic: "bttf_time_circuits/{{ ((device_attr(device, 'identifiers') | list | last)[1]) | trim }}/sequencer/command"
      payload: >-
        {#-
          JINJA2 TEMPLATE LOGIC
          This template constructs the JSON payload for the device's sequencer command.
          It iterates through the 'rows_data' variable defined above and generates a separate "track"
          for each row that has text defined. This allows all three rows to animate in parallel.
          The final output is a JSON array of these track objects.
        -#}
        {%- macro generate_row_payload(row_data, dur, m_speed, f_speed, restore) -%}
          {#- A namespace is used to hold the list of tracks as it's built. -#}
          {%- set ns = namespace(tracks=[]) -%}
          {#-
            Define which effects are self-blocking (run until complete) vs. timed (run for a set duration).
            This determines whether we need to add a `WAIT` command.
          -#}
          {%- set blocking_effects = ['MARQUEE', 'TYPEWRITER', 'SCRAMBLE_TEXT', 'RANDOM_FLICKER_TEXT'] -%}
          {%- set timed_effects = ['PULSE', 'FLASH'] -%}

          {# --- STEP 1: Loop through each row's configuration data --- #}
          {%- for row in row_data -%}
            {#- Only generate a track if the text for the current row is not empty. -#}
            {%- if row.text | default('') != '' -%}
              {%- set core_commands = [] -%}

              {# --- STEP 2: Build the main visual command for the current row --- #}
              {%- set visual_command = {'command': row.effect, 'targetSegment': -1, 'stringParam': row.text} -%}
              {#- Add effect-specific parameters based on the chosen effect. -#}
              {%- if row.effect == 'MARQUEE' -%}
                {%- set visual_command = dict(visual_command, intParam=m_speed | int) -%}
              {%- elif row.effect == 'RANDOM_FLICKER_TEXT' -%}
                {%- set visual_command = dict(visual_command, intParam=f_speed | int) -%}
              {%- elif row.effect in timed_effects -%}
                {#- Pulse and Flash use `intParam2` for their total duration. -#}
                {%- set visual_command = dict(visual_command, intParam2=(dur * 1000) | int) -%}
              {%- endif -%}
              {%- set core_commands = core_commands + [visual_command] -%}

              {# --- STEP 3: For static effects, add a WAIT command to control duration. --- #}
              {%- if row.effect not in blocking_effects and row.effect not in timed_effects -%}
                {%- set wait_duration = (dur * 1000) | int -%}
                {%- set core_commands = core_commands + [{'command': 'WAIT', 'intParam': wait_duration}] -%}
              {%- endif -%}

              {# --- STEP 4: Add the restore command if requested --- #}
              {%- if restore -%}
                {#- `RESTORE_ROW` tells the device to revert this specific row to its previous state. -#}
                {%- set core_commands = core_commands + [{'command': 'RESTORE_ROW'}] -%}
              {%- endif -%}

              {# --- STEP 5: Add sound to the very first track that gets generated --- #}
              {#- This ensures the sound only plays once, even if multiple rows are active. -#}
              {%- if ns.tracks | length == 0 and audio_source == 'builtin' -%}
                {#- Convert HA's 0-100 volume to the device's 0-21 scale. -#}
                {%- set device_volume = ((volume / 100) * 21) | round(0) | int -%}
                {%- set sound_command = {'command': 'SOUND', 'stringParam': sound_effect, 'intParam': device_volume} -%}
                {#- Prepend the sound command so it plays at the beginning. -#}
                {%- set core_commands = [sound_command] + core_commands -%}
              {%- endif -%}

              {#- Create the final track object with the target row and its list of commands. -#}
              {%- set track_object = {'targetRow': row.target, 'commands': core_commands} -%}
              {#- Add the completed track object to our list of tracks. -#}
              {%- set ns.tracks = ns.tracks + [track_object] -%}
            {%- endif -%}
          {%- endfor -%}

          {# --- STEP 6: Return the raw JSON array of tracks --- #}
          {#- The `to_json` filter converts the Python list of dictionaries into a valid JSON string. -#}
          {{- ns.tracks | to_json -}}
        {%- endmacro -%}
        {#- Call the macro with all the relevant inputs to generate the final payload. -#}
        {{- generate_row_payload(rows_data, duration, marquee_speed, flicker_speed, restore_rows) -}}

  # Parallel Action: Handle streaming audio from Home Assistant.
  - choose:
      # This entire block runs in parallel with the MQTT `publish` service call above.
      - conditions:
          # Only run this sequence if the user selected 'media' and provided a media file.
          - "{{ audio_source == 'media' and media_file != '' }}"
        sequence:
          # Determine the target media_player. Use the override if provided, otherwise find the one from the device.
          - variables:
              target_player: >-
                {% if audio_output_player is defined and audio_output_player != '' %}
                  {{ audio_output_player }}
                {% else %}
                  {{ device_entities(device) | select('startswith', 'media_player.') | first | default('none') }}
                {% endif %}
          # Condition: Ensure we have a valid media_player to target.
          - condition: template
            value_template: "{{ target_player != 'none' }}"
          # Set the volume on the target media player before playing.
          - service: media_player.volume_set
            target:
              entity_id: "{{ target_player }}"
            data:
              volume_level: "{{ volume / 100 }}"
          # Play the selected media file from the HA media library. This plays immediately.
          - service: media_player.play_media
            target:
              entity_id: "{{ target_player }}"
            data:
              media_content_id: !input media_file
              media_content_type: "music"