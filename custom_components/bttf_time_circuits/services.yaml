run_sequence:
  name: Run Sequence
  description: "Runs a sequence of commands on the device."
  fields:
    sequence:
      name: Sequence
      description: "A list of commands to execute."
      required: true
      selector:
        object:
    target_row:
      name: Target Row
      description: "The display row to target."
      selector:
        number:
          min: 0
          max: 2

favorite_radio_station:
  name: Favorite Radio Station
  description: "Plays the favorite radio station."

clear_favorite_radio_stations:
  name: Clear Favorite Radio Stations
  description: "Clears the favorite radio stations."

set_destination_time:
  name: Set Destination Time
  description: "Sets the destination time."
  fields:
    datetime:
      name: Datetime
      description: "The date and time to set."
      required: true
      selector:
        datetime:

set_present_time:
  name: Set Present Time
  description: "Sets the present time."
  fields:
    datetime:
      name: Datetime
      description: "The date and time to set."
      required: true
      selector:
        datetime:

set_last_departed_time:
  name: Set Last Departed Time
  description: "Sets the last departed time."
  fields:
    datetime:
      name: Datetime
      description: "The date and time to set."
      required: true
      selector:
        datetime:

time_travel:
  name: Time Travel
  description: "Initiates a time travel sequence."
  fields:
    datetime:
      name: Datetime
      description: "The destination date and time."
      required: true
      selector:
        datetime:
