blueprint:
  name: BTTF Time Circuits - Marquee Data Slot Display
  description: >-
    Display the state of a Home Assistant entity on the clock's marquee
    data slot. The clock's Data Point Source must be set to "Home Assistant Push"
    for this to work.
  domain: automation
  input:
    target_device:
      name: Time Circuits Device
      description: Select the BTTF Time Circuits clock device.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    data_point_slot:
      name: Data Point Slot
      description: Which of the five marquee slots to use for this data.
      default: "0"
      selector:
        select:
          options:
            - label: "Data Point 1"
              value: "0"
            - label: "Data Point 2"
              value: "1"
            - label: "Data Point 3"
              value: "2"
            - label: "Data Point 4"
              value: "3"
            - label: "Data Point 5"
              value: "4"
    marquee_month:
      name: Marquee Month Text (3 Chars)
      description: Static text or a template for the MONTH display in marquee mode.
      default: "DATA"
      selector:
        text:
    marquee_day:
      name: Marquee Day Text (2 Chars)
      description: Static text or a template for the DAY display in marquee mode.
      default: ""
      selector:
        text:
    marquee_year:
      name: Marquee Year Text (4 Chars)
      description: Static text or a template for the YEAR display in marquee mode.
      default: ""
      selector:
        text:
    marquee_time:
      name: Marquee Time Text (4 Chars)
      description: Static text or a template for the TIME display in marquee mode.
      default: "{{ states(marquee_target_entity) }}"
      selector:
        text:
    marquee_target_entity:
      name: Marquee Target Entity
      description: The entity whose state you want to show in marquee mode.
      default: ""
      selector:
        entity: {}

variables:
  device_id: !input target_device
  device_name: "{{ device_attr(device_id, 'name') | lower | replace(' ', '_') }}"
  clock_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"
  slot: !input data_point_slot

trigger:
  - platform: state
    entity_id: !input marquee_target_entity

action:
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/datapoint/{{ slot }}/month/set"
      payload: "{{ marquee_month }}"
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/datapoint/{{ slot }}/day/set"
      payload: "{{ marquee_day }}"
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/datapoint/{{ slot }}/year/set"
      payload: "{{ marquee_year }}"
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/datapoint/{{ slot }}/time/set"
      payload: "{{ marquee_time }}"