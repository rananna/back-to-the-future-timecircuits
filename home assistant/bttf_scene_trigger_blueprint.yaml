blueprint:
  name: BTTF Time Circuits - Cinematic Scene Trigger
  description: >-
    Set a destination year and trigger the full, cinematic time travel animation.
    Ideal for starting scenes or reacting to events.
  domain: automation
  input:
    target_device:
      name: Time Circuits Device
      description: Select the BTTF Time Circuits clock device.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    destination_year:
      name: Destination Year
      description: The four-digit year to travel to.
      default: 2015
      selector:
        number:
          min: 1000
          max: 9999

variables:
  device_id: !input target_device
  # Find the main status sensor entity to derive the base name for other entities.
  status_entity: "{{ device_entities(device_id) | select('search', '_status') | first }}"
  device_base_name: "{{ state_attr(status_entity, 'object_id').replace('_status', '') }}"
  # Construct the full entity IDs from the base name
  destination_year_entity_id: "number.{{ device_base_name }}_destination_year"
  trigger_animation_button_id: "button.{{ device_base_name }}_trigger_animation"

trigger: []

action:
  - service: number.set_value
    target:
      entity_id: "{{ destination_year_entity_id }}"
    data:
      value: !input destination_year
  - service: button.press
    target:
      entity_id: "{{ trigger_animation_button_id }}"