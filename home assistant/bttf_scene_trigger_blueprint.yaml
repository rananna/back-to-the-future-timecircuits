blueprint:
  name: BTTF Time Circuits - Cinematic Scene Trigger
  description: >-
    Set a destination year and trigger the full, cinematic time travel animation.
    Ideal for starting scenes or reacting to events.
  domain: automation
  input:
    destination_year_entity:
      name: Destination Year Entity
      description: The 'number' entity that controls the destination year.
      selector:
        entity:
          domain: number
          integration: mqtt
    trigger_animation_button:
      name: Trigger Animation Button
      description: The 'button' entity that triggers the time travel animation.
      selector:
        entity:
          domain: button
          integration: mqtt
    destination_year:
      name: Destination Year
      description: The four-digit year to travel to.
      default: 2015
      selector:
        number:
          min: 1000
          max: 9999

trigger: []

action:
  - service: number.set_value
    target:
      entity_id: !input destination_year_entity
    data:
      value: !input destination_year
  - service: button.press
    target:
      entity_id: !input trigger_animation_button