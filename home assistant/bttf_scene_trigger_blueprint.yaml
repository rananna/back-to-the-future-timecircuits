blueprint:
  name: BTTF Time Circuits - Cinematic Scene Trigger
  description: >-
    Set a destination year and trigger the full, cinematic time travel animation.
    Ideal for starting scenes or reacting to events.
  domain: automation
  input:
    target_device:
      name: Time Circuits Device
      description: Select the BTTF Time Circuits clock device to control.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"

    destination_year:
      name: Destination Year
      description: The four-digit year to travel to.
      default: 2015
      selector:
        number:
          min: 1000
          max: 9999
          
    destination_date_time:
      name: Destination Date and Time
      description: The exact date and time to trigger the animation. Leave blank to trigger immediately.
      default: ""
      selector:
        datetime:

trigger:
  - platform: time
    at: !input destination_date_time

variables:
  target_device_id: !input target_device
  dest_year_entity: >
    {{ device_entities(target_device_id) | select('search', 'destination_year') | first }}
  trigger_anim_entity: >
    {{ device_entities(target_device_id) | select('search', 'trigger_animation') | first }}
  ack_topic: >
    "timecircuits/{{ device_attr(target_device_id, 'identifiers')[0][1] }}/destination_year/state"

action:
  - service: number.set_value
    target:
      entity_id: "{{ dest_year_entity }}"
    data:
      value: !input destination_year
  - wait_for_trigger:
      - platform: mqtt
        topic: "{{ ack_topic }}"
        payload: "{{ destination_year }}"
    timeout: "00:00:10"
  - service: button.press
    target:
      entity_id: "{{ trigger_anim_entity }}"