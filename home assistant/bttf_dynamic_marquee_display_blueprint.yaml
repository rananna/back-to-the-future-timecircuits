blueprint:
  name: "BTTF - Dynamic Marquee Display"
  description: >-
    Display a single, scrolling line of text on one of the five data point slots.
    Use Home Assistant's templating engine to create dynamic messages.
    For example: "Outside temp is {{ states('sensor.outside_temperature') }}°C"
    This blueprint sends the text via MQTT to the selected data point slot.
    The clock's Data Point Source for that slot must be set to "Home Assistant Push" for this to work.
  domain: automation
  input:
    target_device:
      name: Time Circuits Device
      description: Select the BTTF Time Circuits clock device.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"
    data_point_slot:
      name: Data Point Slot
      description: Which of the five marquee slots to use for this data.
      default: "0"
      selector:
        select:
          options:
            - label: "Data Point 1"
              value: "0"
            - label: "Data Point 2"
              value: "1"
            - label: "Data Point 3"
              value: "2"
            - label: "Data Point 4"
              value: "3"
            - label: "Data Point 5"
              value: "4"
    text:
      name: Marquee Text
      description: The text to display. Supports templates.
      selector:
        text:

variables:
  device_id: !input target_device
  slot: !input data_point_slot
  unique_id: "{{ device_attr(device_id, 'identifiers')[0][1] }}"
  marquee_text: !input text
  marquee_month: "{{ (marquee_text ~ '                ')[0:4] }}"
  marquee_day:   "{{ (marquee_text ~ '                ')[4:8] }}"
  marquee_year:  "{{ (marquee_text ~ '                ')[8:12] }}"
  marquee_time:  "{{ (marquee_text ~ '                ')[12:16] }}"

# This automation has no trigger, it is meant to be called from a script or another automation.
trigger: []

action:
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ unique_id }}/datapoint/{{ slot }}/month/set"
      payload: "{{ marquee_month }}"
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ unique_id }}/datapoint/{{ slot }}/day/set"
      payload: "{{ marquee_day }}"
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ unique_id }}/datapoint/{{ slot }}/year/set"
      payload: "{{ marquee_year }}"
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ unique_id }}/datapoint/{{ slot }}/time/set"
      payload: "{{ marquee_time }}"