blueprint:
  name: BTTF Time Circuits - TTS Notifier
  description: >-
    Converts a text message into speech and plays it on the clock.
    An optional message can be displayed during playback. For complex display
    setups, call the "Home Assistant Status Display" blueprint first.
  domain: automation
  input:
    time_circuits_device:
      name: Time Circuits Display
      description: Select the Time Circuits clock device.
      selector:
        device:
          integration: mqtt
          manufacturer: "Doc Brown Industries"
    tts_service:
      name: TTS Service
      description: The TTS service to use for generating the speech URL (e.g., tts.google_en_com).
      default: "tts.google_en_com"
      selector:
        text:
    message_text:
      name: Message Text
      description: The text you want the clock to say.
      selector:
        text:
          multiline: true
    volume:
      name: Playback Volume
      description: The volume for the TTS message (0-100).
      default: 80
      selector:
        number:
          min: 0
          max: 100
    display_text:
      name: Display Text (Optional)
      description: "A message to show on the clock's display. Use '\\n' for new lines."
      default: ""
      selector:
        text:
          multiline: true

variables:
  clock_id: "{{ device_attr(time_circuits_device, 'identifiers')[0][1] }}"

trigger: []

action:
  # 1. Set the override text and activate the override display mode.
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/override_text/command"
      payload: !input display_text
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/override/command"
      payload: "ON"

  # 2. This block contains the main logic. The 'finally' action will run after this.
  - sequence:
      # Generate TTS URL
      - service: !input tts_service
        data:
          message: !input message_text
        response_variable: tts_response

      # Play TTS on clock
      - service: mqtt.publish
        data:
          topic: "timecircuits/{{ clock_id }}/tts/play"
          payload: '{"url": "{{ tts_response.url }}", "volume": {{ volume }} }'

      # Wait for playback to finish
      - wait_for_trigger:
          - platform: mqtt
            topic: "timecircuits/{{ clock_id }}/audio/state"
            payload: "IDLE"
        timeout: "00:01:00"
        continue_on_timeout: true

  # 3. This serves as the 'finally' block. It always runs after the main sequence.
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/override/command"
      payload: "OFF"