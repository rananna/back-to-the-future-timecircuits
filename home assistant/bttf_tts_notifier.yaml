blueprint:
  name: BTTF Time Circuits - TTS Notifier
  description: >-
    Converts a text message into speech using Home Assistant's TTS engine and plays
    it on the Time Circuits clock. This version is corrected for proper TTS service
    calls and robust execution.
  domain: automation
  input:
    time_circuits_device:
      name: Time Circuits Display
      description: Select the Time Circuits clock device.
      selector:
        device:
          integration: mqtt
          manufacturer: "Doc Brown Industries"
    tts_service:
      name: TTS Service
      description: The TTS service to use for generating the speech URL (e.g., tts.google_en_com).
      default: "tts.google_en_com"
      selector:
        text:
    message_text:
      name: Message Text
      description: The text you want the clock to say.
      selector:
        text:
          multiline: true
    volume:
      name: Playback Volume
      description: The volume for the TTS message (0-100).
      default: 80
      selector:
        number:
          min: 0
          max: 100
    display_message:
      name: Display Text (Optional)
      description: "A message to show on the clock's display. Use '\\n' to separate lines for each of the 3 displays."
      default: ""
      selector:
        text:
          multiline: true

variables:
  clock_id: "{{ device_attr(time_circuits_device, 'identifiers')[0][1] }}"
  display_lines: "{{ display_message.split('\\n') }}"
  line1: "{{ display_lines[0] | default('') }}"
  line2: "{{ display_lines[1] | default('') }}"
  line3: "{{ display_lines[2] | default('') }}"

trigger: []

action:
  # 1. Enter Notification Mode
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/notification/command"
      payload: "START"
  - delay:
      seconds: 1

  # 2. This block contains the main logic. The 'finally' action will run after this.
  - sequence:
      - if: "{{ display_message != '' }}"
        then:
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/dest_month/command"
              payload: "{{ (line1 | upper ~ '            ')[0:4] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/dest_day/command"
              payload: "{{ (line1 | upper ~ '            ')[4:8] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/dest_year/command"
              payload: "{{ (line1 | upper ~ '            ')[8:12] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/pres_month/command"
              payload: "{{ (line2 | upper ~ '            ')[0:4] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/pres_day/command"
              payload: "{{ (line2 | upper ~ '            ')[4:8] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/pres_year/command"
              payload: "{{ (line2 | upper ~ '            ')[8:12] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/last_month/command"
              payload: "{{ (line3 | upper ~ '            ')[0:4] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/last_day/command"
              payload: "{{ (line3 | upper ~ '            ')[4:8] }}"
          - service: mqtt.publish
            data:
              topic: "timecircuits/{{ clock_id }}/last_year/command"
              payload: "{{ (line3 | upper ~ '            ')[8:12] }}"

      # Generate TTS URL
      - service: !input tts_service
        data:
          message: !input message_text
        response_variable: tts_response

      # Play TTS on clock
      - service: mqtt.publish
        data:
          topic: "timecircuits/{{ clock_id }}/tts/play"
          payload: '{"url": "{{ tts_response.url }}", "volume": {{ volume }} }'

      # Wait for playback to finish
      - wait_for_trigger:
          - platform: mqtt
            topic: "timecircuits/{{ clock_id }}/audio/state"
            payload: "IDLE"
        timeout: "00:01:00"
        continue_on_timeout: true

  # 3. This serves as the 'finally' block. It always runs after the main sequence.
  - service: mqtt.publish
    data:
      topic: "timecircuits/{{ clock_id }}/notification/command"
      payload: "END"