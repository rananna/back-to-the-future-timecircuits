blueprint:
  name: Home Assistant Status Display
  description: >-
    A "callable" automation that you can use to push any Home Assistant entity state
    or attribute to one of the 12 display segments on your Time Circuits clock.
    This blueprint has no trigger; you call it as an action from your own automations.
    For each of the 12 segments, you can provide either static text or a Home Assistant template.
    For example, to display the current temperature on the destination 'time' segment, you would enter:
    `{{ states('sensor.your_temperature_sensor') }}`
  domain: automation
  input:
    target_device:
      name: Time Circuits Device
      description: Select the BTTF Time Circuits clock to update.
      selector:
        device:
          manufacturer: "Doc Brown Industries"
          model: "BTTF Clock v1"

    # Destination Time Inputs
    destination_month:
      name: Destination Month
      description: Text or template for the Destination Month display.
      default: ""
      selector:
        text:
    destination_day:
      name: Destination Day
      description: Text or template for the Destination Day display.
      default: ""
      selector:
        text:
    destination_year:
      name: Destination Year
      description: Text or template for the Destination Year display.
      default: ""
      selector:
        text:
    destination_time:
      name: Destination Time
      description: Text or template for the Destination Time display.
      default: ""
      selector:
        text:

    # Present Time Inputs
    present_month:
      name: Present Month
      description: Text or template for the Present Month display.
      default: ""
      selector:
        text:
    present_day:
      name: Present Day
      description: Text or template for the Present Day display.
      default: ""
      selector:
        text:
    present_year:
      name: Present Year
      description: Text or template for the Present Year display.
      default: ""
      selector:
        text:
    present_time:
      name: Present Time
      description: Text or template for the Present Time display.
      default: ""
      selector:
        text:

    # Last Departed Inputs
    last_departed_month:
      name: Last Departed Month
      description: Text or template for the Last Departed Month display.
      default: ""
      selector:
        text:
    last_departed_day:
      name: Last Departed Day
      description: Text or template for the Last Departed Day display.
      default: ""
      selector:
        text:
    last_departed_year:
      name: Last Departed Year
      description: Text or template for the Last Departed Year display.
      default: ""
      selector:
        text:
    last_departed_time:
      name: Last Departed Time
      description: Text or template for the Last Departed Time display.
      default: ""
      selector:
        text:

variables:
  device_id: !input target_device
  # Find the main status sensor entity associated with the device.
  status_entity: >
    {{ device_entities(device_id) | select('search', '_status') | first }}
  # Extract its object_id (e.g., 'time_circuits_display_status') and remove the '_status' suffix
  # to get the reliable base name for all other entities (e.g., 'time_circuits_display').
  device_base_name: "{{ state_attr(status_entity, 'object_id').replace('_status', '') }}"

  # Create a dictionary of the inputs to loop through
  segments:
    dest_month: !input destination_month
    dest_day: !input destination_day
    dest_year: !input destination_year
    dest_time: !input destination_time
    pres_month: !input present_month
    pres_day: !input present_day
    pres_year: !input present_year
    pres_time: !input present_time
    last_month: !input last_departed_month
    last_day: !input last_departed_day
    last_year: !input last_departed_year
    last_time: !input last_departed_time

# This automation is designed to be called by other automations or scripts.
trigger: []

action:
  # Loop through the dictionary of segments
  - repeat:
      for_each: "{{ segments.items() }}"
      sequence:
        # Only call the service if the user actually provided a value for this segment
        - if:
            - "{{ repeat.item.value != '' }}"
          then:
            - service: text.set_value
              target:
                entity_id: "text.{{ device_base_name }}_{{ repeat.item.key }}"
              data:
                value: "{{ repeat.item.value }}"
